  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;min-height:100vh;transition:background .2s,color .2s}

    /* === DARK MODE (padrao) === */
    body.dark{
      background:#0a0e1a;
      color:#e2e8f0;
    }
    body.dark .card{background:#111827;border:1px solid #1e293b}
    body.dark .header{background:#111827;border-bottom:1px solid #1e293b}
    body.dark .kpi{background:#111827;border:1px solid #1e293b}
    body.dark .tabs{background:#111827;border-bottom:1px solid #1e293b}
    body.dark .tab{color:#64748b}
    body.dark .tab:hover{color:#e2e8f0;background:rgba(255,255,255,.05)}
    body.dark .tab.active{color:#f59e0b;border-bottom-color:#f59e0b}
    body.dark .fbar{background:#111827;border:1px solid #1e293b}
    body.dark .ms-btn{background:#1e293b;border-color:#334155;color:#e2e8f0}
    body.dark .ms-panel{background:#1e293b;border-color:#334155}
    body.dark .ms-search{background:#111827;border-color:#334155;color:#e2e8f0}
    body.dark .ms-opt:hover{background:rgba(255,255,255,.06)}
    body.dark .tbl-wrap table th{background:#1e293b;color:#94a3b8;border-color:#334155}
    body.dark .tbl-wrap table td{border-color:#1e293b}
    body.dark .tbl-wrap table tr:hover td{background:rgba(255,255,255,.04)}
    body.dark .tbl-wrap table tr.tot td{background:#1e3a2e;color:#34d399;font-weight:700}
    body.dark .filter-select{background:#1e293b;border-color:#334155;color:#e2e8f0}
    body.dark footer{background:#111827;border-top:1px solid #1e293b;color:#64748b}
    body.dark .ov-panel{background:#1a2235;border:1px solid #1e293b}
    body.dark .imp-card{background:#1a2235;border:1px solid #334155}
    body.dark .btn-theme{background:#1e293b;border-color:#334155;color:#e2e8f0}

    /* === LIGHT MODE === */
    body.light{
      background:#f1f4f9;
      color:#0f172a;
    }
    body.light .card{background:#fff;border:1px solid #e2e8f0}
    body.light .header{background:#113d85;border-bottom:1px solid #0e326b}
    body.light .kpi{background:#fff;border:1px solid #e2e8f0}
    body.light .kpi .lbl{color:#64748b}
    body.light .kpi .cnt{color:#64748b}
    body.light .tabs{background:#fff;border-bottom:1px solid #e2e8f0}
    body.light .tab{color:#64748b}
    body.light .tab:hover{color:#113d85;background:rgba(17,61,133,.05)}
    body.light .tab.active{color:#113d85;border-bottom-color:#113d85}
    body.light .fbar{background:#fff;border:1px solid #e2e8f0}
    body.light .ms-btn{background:#f8fafc;border-color:#e2e8f0;color:#0f172a}
    body.light .ms-panel{background:#fff;border-color:#e2e8f0;box-shadow:0 8px 24px rgba(0,0,0,.1)}
    body.light .ms-search{background:#f1f5f9;border-color:#e2e8f0;color:#0f172a}
    body.light .ms-opt:hover{background:#f1f5f9}
    body.light .tbl-wrap table th{background:#113d85;color:#fff;border-color:#0e326b}
    body.light .tbl-wrap table td{border-color:#e2e8f0;color:#0f172a}
    body.light .tbl-wrap table tr:hover td{background:#f8fafc}
    body.light .tbl-wrap table tr.tot td{background:#dcfce7;color:#166534;font-weight:700}
    body.light .filter-select{background:#fff;border-color:#e2e8f0;color:#0f172a}
    body.light footer{background:#113d85;color:rgba(255,255,255,.6);border-top:none}
    body.light .ov-panel{background:#fff;border:1px solid #e2e8f0}
    body.light .imp-card{background:#f8fafc;border:1px solid #e2e8f0}
    body.light .btn-theme{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}

    /* === ESTRUTURA === */
    .header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;position:sticky;top:0;z-index:200}
    .header-left{display:flex;align-items:center;gap:12px}
    .header-title .brand{font-size:16px;font-weight:700;color:#fff}
    .header-title .sub{font-size:12px;color:rgba(255,255,255,.6);display:block;margin-top:1px}
    .header-right{display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,.5)}
    .btn-theme{border:1px solid;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
    .btn-theme:hover{opacity:.8}

    .content{max-width:1600px;margin:0 auto;padding:16px 20px}
    .card{border-radius:10px;padding:16px;margin-bottom:16px}

    /* KPIs */
    .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
    .kpi{border-radius:10px;padding:16px;cursor:default}
    .kpi .lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
    .kpi .val{font-size:22px;font-weight:800;line-height:1}
    .kpi .cnt{font-size:11px;margin-top:6px}

    /* Tabs */
    .tabs{display:flex;gap:0;padding:0 20px;position:sticky;top:52px;z-index:150;overflow-x:auto}
    .tab{background:none;border:none;border-bottom:2px solid transparent;padding:12px 16px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}

    /* Filter bar */
    .fbar{border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .fbar-search{background:transparent;border:1px solid #334155;border-radius:6px;padding:6px 10px;font-size:13px;color:inherit;font-family:inherit;min-width:180px}
    body.light .fbar-search{border-color:#e2e8f0;background:#f8fafc;color:#0f172a}
    .fbar-search:focus{outline:none;border-color:#f59e0b}
    .fbar-reset{background:none;border:1px solid #ef4444;border-radius:6px;padding:6px 10px;color:#ef4444;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
    .fbar-reset:hover{background:#ef4444;color:#fff}
    .cnt-badge{font-size:12px;font-weight:700;color:#f59e0b;margin-left:auto;white-space:nowrap}
    body.light .cnt-badge{color:#113d85}

    /* Multi-select dropdown */
    .ms-wrap{position:relative}
    .ms-btn{border:1px solid;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;white-space:nowrap}
    .ms-btn.has-sel{border-color:#f59e0b;color:#f59e0b}
    body.light .ms-btn.has-sel{border-color:#113d85;color:#113d85}
    .ms-panel{position:absolute;top:calc(100% + 4px);left:0;min-width:220px;border-radius:8px;border:1px solid;z-index:500;padding:8px;display:none}
    .ms-panel.open{display:block}
    .ms-search{width:100%;border:1px solid;border-radius:5px;padding:5px 8px;font-size:12px;font-family:inherit;margin-bottom:6px}
    .ms-sep{border:none;border-top:1px solid #1e293b;margin:4px 0}
    body.light .ms-sep{border-color:#e2e8f0}
    .ms-opts{max-height:180px;overflow-y:auto}
    .ms-opt{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:12px}
    .ms-opt input{cursor:pointer}

    /* Tabela */
    .tbl-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .tbl-hdr h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
    .dl-btn{background:none;border:1px solid #10b981;color:#10b981;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
    .dl-btn:hover{background:#10b981;color:#fff}
    .tbl-wrap{overflow-x:auto}
    table.dt{width:100%;border-collapse:collapse;font-size:12px}
    table.dt th{padding:9px 12px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;cursor:pointer;user-select:none}
    table.dt th:hover{opacity:.8}
    table.dt td{padding:8px 12px;border-bottom:1px solid;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
    table.dt tr:last-child td{border-bottom:none}
    table.dt .nr{text-align:right}
    table.dt .sa{opacity:.4;font-size:10px;margin-left:2px}

    /* Paginacao */
    .tbl-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12px}
    .pagination{display:flex;gap:4px}
    .btn-pg{border:1px solid;border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12px;font-family:inherit}
    body.dark .btn-pg{background:#1e293b;border-color:#334155;color:#e2e8f0}
    body.light .btn-pg{background:#fff;border-color:#e2e8f0;color:#0f172a}
    .btn-pg:disabled{opacity:.4;cursor:not-allowed}

    /* Overview panels */
    .ov-row1{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}
    .ov-row2{display:grid;grid-template-columns:1fr 2fr;gap:14px;margin-bottom:14px}
    .ov-row3{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}
    .ov-panel{border-radius:10px;padding:16px}
    .ov-panel-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin-bottom:12px}
    body.light .ov-panel-title{color:#94a3b8}
    .ov-panel canvas{max-height:300px}
    .ov-panel.tall canvas{max-height:360px}
    @media(max-width:768px){
      .ov-row2{grid-template-columns:1fr}
    }

    /* Impostos */
    .imp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
    .imp-card{border-radius:8px;padding:12px 14px}
    .imp-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748b;margin-bottom:4px}
    .imp-value{font-size:15px;font-weight:800;color:inherit}
    .imp-pct{font-size:11px;color:#64748b;margin-top:2px}

    /* Badges */
    .badge-blue{background:#1e3a5f;color:#93c5fd;border-radius:4px;padding:2px 7px;font-size:11px;font-weight:600}
    .badge-green{background:#14532d;color:#86efac;border-radius:4px;padding:2px 7px;font-size:11px;font-weight:600}
    body.light .badge-blue{background:#dbeafe;color:#1e40af}
    body.light .badge-green{background:#dcfce7;color:#166534}


    /* AG: Filtro de Mes */
    .month-bar{padding:8px 20px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
    body.dark  .month-bar{background:#111827;border-bottom:1px solid #1e293b;}
    body.light .month-bar{background:#fff;border-bottom:1px solid #e2e8f0;}
    .mchip-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#64748b;margin-right:4px;}
    .mchip{padding:4px 12px;border-radius:20px;border:1px solid;background:transparent;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:all .15s;}
    body.dark  .mchip{border-color:#334155;color:#94a3b8;}
    body.light .mchip{border-color:#e2e8f0;background:#f8fafc;color:#64748b;}
    .mchip:hover{border-color:#f59e0b!important;color:#f59e0b!important;}
    body.light .mchip:hover{border-color:#113d85!important;color:#113d85!important;}
    .mchip.active{background:#f59e0b;color:#0f172a;border-color:#f59e0b;}
    body.light .mchip.active{background:#113d85;color:#fff;border-color:#113d85;}

    footer{padding:14px 20px;text-align:center;font-size:11px;margin-top:8px}

    @media(max-width:768px){
      .kpi-row{grid-template-columns:1fr 1fr}
      .ov-charts{grid-template-columns:1fr}
      .ov-bottom{grid-template-columns:1fr}
    }


    /* ── Botao PDF ── */
    .btn-pdf{background:#ef4444;color:#fff;border:none;border-radius:7px;padding:7px 13px;
              font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;
              display:flex;align-items:center;gap:5px;transition:background .15s}
    .btn-pdf:hover{background:#dc2626}

  </style>
  <style>
    #pw-overlay{position:fixed;inset:0;z-index:99999;background:#0a0e1a;
                display:flex;align-items:center;justify-content:center}
    .pw-box{background:#111827;border:1px solid #1e293b;border-radius:14px;
            padding:36px 32px;width:100%;max-width:380px;text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative}
    .pw-title{font-size:17px;font-weight:700;color:#e2e8f0;margin-bottom:6px}
    .pw-sub{font-size:13px;color:#64748b;margin-bottom:24px;line-height:1.5}
    .pw-inp{width:100%;background:#1e293b;border:1px solid #334155;
            border-radius:8px;padding:11px 14px;font-size:14px;color:#e2e8f0;
            font-family:inherit;margin-bottom:12px;box-sizing:border-box}
    .pw-inp:focus{outline:none;border-color:#f59e0b}
    .pw-btn{width:100%;padding:12px;background:#f59e0b;color:#0a0e1a;
            border:none;border-radius:8px;font-size:14px;font-weight:800;
            cursor:pointer;font-family:inherit}
    .pw-btn:hover{background:#d97706}
    .pw-err{color:#ef4444;font-size:12px;margin-top:10px;font-weight:600;display:none}
    .pw-version{font-size:11px;color:#334155;margin-top:18px}
    .pw-fs{position:absolute;top:10px;right:10px;background:none;
           border:1px solid #334155;border-radius:6px;padding:4px 8px;
           color:#64748b;font-size:11px;cursor:pointer}
  </style>
</head>
<body class="dark">
  <div id="pw-overlay">
    <div class="pw-box">
      <button class="pw-fs" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">&#x26F6; Tela cheia</button>
      <svg viewBox="0 0 48 48" width="48" height="48" style="margin:0 auto 18px;display:block">
        <rect width="48" height="48" rx="8" fill="#1B2A6B"/>
        <path d="M10 34 Q16 10 24 24 Q32 38 38 14" stroke="#FFC72C" stroke-width="3.5" fill="none" stroke-linecap="round"/>

// ── Exportar PDF — download direto via html2canvas + jsPDF ──────────────────
async function exportPDF(){
  const btn = document.querySelector('.btn-pdf');
  btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Gerando...';
  btn.disabled = true;
  window.scrollTo(0,0);
  await new Promise(r => setTimeout(r, 400));
  try {
    const isDark = document.body.classList.contains('dark');
    const bg = isDark ? '#0a0e1a' : '#f8fafc';
    const canvas = await html2canvas(document.body, {
      scale: 1.5,
      backgroundColor: bg,
      useCORS: true,
      allowTaint: true,
      logging: false,
      scrollX: 0, scrollY: 0,
      width:        document.body.scrollWidth,
      height:       document.body.scrollHeight,
      windowWidth:  document.body.scrollWidth,
      windowHeight: document.body.scrollHeight
    });
    const { jsPDF } = window.jspdf;
    const PW = 1190, PH = 842;
    const cw = canvas.width, ch = canvas.height;
    const ratio = PW / cw;
    const sliceH = Math.round(PH / ratio);
    const nPages = Math.ceil(ch / sliceH);
    const pdf = new jsPDF({ orientation:'landscape', unit:'px', format:[PW,PH] });
    for (let p = 0; p < nPages; p++) {
      if (p > 0) pdf.addPage([PW,PH],'landscape');
      const sy = p * sliceH;
      const sh = Math.min(sliceH, ch - sy);
      const sl = document.createElement('canvas');
      sl.width = cw; sl.height = sh;
      sl.getContext('2d').drawImage(canvas, 0, sy, cw, sh, 0, 0, cw, sh);
      pdf.addImage(sl.toDataURL('image/jpeg',0.92),'JPEG',0,0,PW,Math.round(sh*ratio));
    }
    const names = {overview:'Visao_Geral',item:'Por_Item',clientes:'Por_Cliente',
                    impostos:'Impostos',acumulado:'Acumulado_Ano',estoque:'Estoque'};
    pdf.save('TravelBlue_'+(names[activeTab]||activeTab)+'.pdf');
  } catch(e) { alert('Erro: '+e.message); }
  finally {
    btn.innerHTML = '<i class="bi bi-file-earmark-pdf-fill"></i> PDF';
    btn.disabled = false;
  }
}

// Calcula automaticamente quantos meses de 2026 ja encerraram com base na data
// do calendario — nao precisa regerrar o dashboard a cada mes novo.
// Usado pela aba Estoque; chave = r.sku (= SKU 2 da masterdata)
const _CALC_YEAR = 2026;
const _todayD = new Date();
const _closedUntil = _todayD.getFullYear() > _CALC_YEAR ? 12
                   : Math.max(0, _todayD.getMonth()); // getMonth()=0-11; mes atual ainda nao encerrou
const _AVG_MONTHS = [];
for (let _m = 1; _m <= _closedUntil; _m++) {
  _AVG_MONTHS.push(_CALC_YEAR + '-' + String(_m).padStart(2, '0'));
}
const _avgBaseMonths = Math.max(1, _AVG_MONTHS.length);
const _MONTH_SHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const _avgMonthLabel = _AVG_MONTHS.length > 0
  ? _MONTH_SHORT[0] + '-' + _MONTH_SHORT[_AVG_MONTHS.length-1] + '/' + _CALC_YEAR
  : '—';
const _authAvgBase = ALL.filter(r => r.data && _AVG_MONTHS.includes(r.data.slice(0,7)) && r.situacao==='Autorizado');
const _skuAvgBaseQtd = {};
_authAvgBase.forEach(r => {
  const k = r.sku || '';
  if (k) _skuAvgBaseQtd[k] = (_skuAvgBaseQtd[k]||0) + (r.quantidade||0);
});
const _skuAvgSales = {};
Object.keys(_skuAvgBaseQtd).forEach(k => { _skuAvgSales[k] = _skuAvgBaseQtd[k] / _avgBaseMonths; });

// Total vendido no ano completo (Autorizado) — usado na coluna "Qtd Vendida 2026"
const _auth2026 = ALL.filter(r => r.data && r.data.slice(0,4)==='2026' && r.situacao==='Autorizado');
const _skuTotalSales2026 = {};
_auth2026.forEach(r => {

// Agrega o estoque por SKU2 (varios SKU SYSTEM podem mapear para o mesmo SKU2,
// ex: variantes/cores do mesmo produto). Sem isso, "Qtd Vendida 2026" e a Media
// (que sao por SKU2) seriam somadas em duplicidade no total da tabela.
const STOCK_AGG = (function(){
  const groups = {};
  STOCK.forEach(s => {
    const key = s.sku || s.sku_system || '';
    if (!groups[key]) {
      groups[key] = {
        sku: key,
        description: s.description || '',
        brand: s.brand || '', family: s.family || '', category: s.category || '',
        qty: 0, cost_total: 0
      };
    }
    const g = groups[key];
    g.qty        += (s.qty||0);
    g.cost_total += (s.qty||0) * (s.cost_unit||0);
    if (!g.brand    && s.brand)    g.brand    = s.brand;
    if (!g.family   && s.family)   g.family   = s.family;
    if (!g.category && s.category) g.category = s.category;
  });
  return Object.values(groups).map(g => Object.assign(g, {
    cost_unit: g.qty ? g.cost_total / g.qty : 0
  }));
})();

        <div class="val" style="color:${k.c}">${k.v}</div>
        <div class="cnt">${k.n}</div>
      </div>`).join("");

  if(activeTab==="acumulado"){
    // Para acumulado: KPIs por situação

    const SITU_C = {"Autorizado":"#10b981","Cancelado":"#ef4444","Devolvido":"#f59e0b","Devolvido Parcialmente":"#8b5cf6"};
    const SITU_L = {"Autorizado":"Faturado (Autorizado)","Cancelado":"Cancelado","Devolvido":"Devolvido","Devolvido Parcialmente":"Dev. Parcialmente"};
    const totalAll = sum(ALL,"total_nf");
    const kpis = SITU.map(s=>{
      const r2 = ALL.filter(r=>r.situacao===s);
      const nf = sum(r2,"total_nf");
      const pct = totalAll>0?((nf/totalAll)*100).toFixed(1)+"% do total":"0%";
      return {l:SITU_L[s]||s, v:BRL(nf), c:SITU_C[s]||"#94a3b8", n:new Set(r2.map(r=>r.nota_fiscal)).size+" notas · "+pct};
    });
    document.getElementById("kpis").innerHTML = kpis.map(k=>
      `<div class="kpi">
        <div class="lbl">${k.l}</div>
        <div class="val" style="color:${k.c}">${k.v}</div>
        <div class="cnt">${k.n}</div>

  const authNfs  = new Set(authRows.map(r=>r.nota_fiscal)).size;
  // Total Liquido e Qtd Pecas: apenas Autorizado menos Devolvido (igual ao email)
  const totalLiq = sum(authRows,"total_liquido") - sum(devRows,"total_liquido");
  const totalImp = totalFat - totalLiq;
  const totalQtd = sum(authRows,"quantidade");
  const kpis = [
    {l:"Vendas "+_MES_LABEL,      v:BRL(totalNF),  c:"#3b82f6", n:nfs+" notas"},
    {l:"Faturado (Aut - Dev)",     v:BRL(totalFat), c:"#10b981", n:authNfs+" NF autorizadas"},

    {l:"Total Liquido",            v:BRL(totalLiq), c:"#10b981", n:"NF - Impostos"},
    {l:"Total Impostos",           v:BRL(totalImp), c:"#ef4444", n:totalNF>0?((totalImp/totalNF)*100).toFixed(1)+"% da NF":"0%"},
    {l:"Qtd Pecas",                v:R(totalQtd),   c:"#8b5cf6", n:authRows.length+" itens (Autorizado)"},

  document.getElementById("kpis").innerHTML = kpis.map(k=>

      <div class="val" style="color:${k.c}">${k.v}</div>
      <div class="cnt">${k.n}</div>
    </div>`).join("");

  const dayOpts = [...new Set(ALL.map(r=>r.data.slice(8,10)).filter(Boolean))].sort();
  let html = `
    <i class="bi bi-search" style="color:#64748b"></i>
    <input class="fbar-search" type="text" placeholder="Buscar cliente, NF, vendedor..." value="${esc(F.search)}"
      oninput="F.search=this.value;currentPage=0;refresh()">
    <div class="ms-wrap">
      <button class="ms-btn ${F.data?"has-sel":""}" onclick="this.nextElementSibling.classList.toggle('open')"
        >${F.data?"Dia "+F.data:"-- Dia --"} <i class="bi bi-chevron-down" style="font-size:10px"></i></button>
      <div class="ms-panel" style="min-width:120px">
        <div class="ms-opts">${[{"v":"","l":"Todos os dias"},...dayOpts.map(d=>({"v":d,"l":"Dia "+d}))]
          .map(o=>`<label class="ms-opt"><input type="radio" name="f-day" value="${o.v}" ${F.data===o.v?"checked":""}
            onchange="F.data=this.value;currentPage=0;rebuildFbar();refresh()"> ${o.l}</label>`).join("")}</div>
      </div>
    </div>
    ${msDd("gerente","Gerente",  uniq("gerente"),          F.gerente)}
    ${msDd("vendedor","Vendedor",uniq("vendedor"),         F.vendedor)}
    ${msDd("agrupado","Cli. Agrupado",uniq("cliente_agrupado"),F.agrupado)}
    ${msDd("razao","Razao Social",uniq("razao_social"),    F.razao)}
    ${(F.data||F.gerente.length||F.vendedor.length||F.agrupado.length||F.razao.length||F.search)?
      '<button class="fbar-reset" onclick="clrF()">x Limpar</button>':''}
    <span class="cnt-badge">${rows.length} itens &middot; ${BRL(totalNF)}</span>`;
  document.getElementById("fbar").innerHTML = html;
}
function rebuildFbar(){ buildFbar(); }
function clrF(){
  F.data=""; F.gerente=[]; F.vendedor=[]; F.agrupado=[]; F.razao=[]; F.search="";
  currentPage=0; rebuildFbar(); refresh();
}

// ── Graficos ──────────────────────────────────────────────────────────────
const charts = {};
function dChart(id){ if(charts[id]){charts[id].destroy();delete charts[id];} }
const TB_COLORS = ["#3b82f6","#f59e0b","#10b981","#ef4444","#8b5cf6","#f97316","#06b6d4","#a855f7"];
function cs(){
  const d=document.body.classList.contains("dark");
  return {grid:d?"rgba(255,255,255,.06)":"rgba(0,0,0,.06)",text:d?"#94a3b8":"#64748b",ff:"'Segoe UI',system-ui,sans-serif"};
}

function renderCharts(rows){
  if (typeof Chart === 'undefined') return; // Chart.js ainda nao carregou
  const {grid,text,ff} = cs();

  // Row 1: Vendas por Dia - full width bar chart
  dChart("ch_data");
  const byD={};
  rows.forEach(r=>{byD[r.data]=(byD[r.data]||0)+r.total_nf;});
  const dE=Object.entries(byD).sort(([a],[b])=>a.localeCompare(b));
  if(dE.length) charts["ch_data"]=new Chart(document.getElementById("ch_data"),{
    type:"bar",
    data:{
      labels:dE.map(([k])=>{
        const m=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
        return k.slice(8,10)+"/"+m[parseInt(k.slice(5,7))-1];
      }),
      datasets:[{data:dE.map(([,v])=>v),backgroundColor:"#3b82f6",borderRadius:6,borderSkipped:false}]
    },
    options:{
      responsive:true,maintainAspectRatio:true,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>"R$ "+(ctx.raw/1000).toFixed(1)+"k"}}},
      scales:{
        x:{grid:{color:grid},ticks:{color:text,font:{family:ff,size:12}}},
        y:{grid:{color:grid},ticks:{color:text,font:{family:ff},callback:v=>"R$ "+(v/1000).toFixed(0)+"k"}}
      }
    }
  });

  // Row 2 left: Vendas por Gerente - donut
  dChart("ch_ger");
  const byG={};
  rows.forEach(r=>{const g=r.gerente||"Sem Gerente";byG[g]=(byG[g]||0)+r.total_nf;});
  const gE=Object.entries(byG).sort(([,a],[,b])=>b-a);
  if(gE.length) charts["ch_ger"]=new Chart(document.getElementById("ch_ger"),{
    type:"doughnut",
    data:{labels:gE.map(([k])=>k),datasets:[{data:gE.map(([,v])=>v),backgroundColor:TB_COLORS,borderWidth:2,hoverOffset:8}]},
    options:{
      responsive:true,maintainAspectRatio:true,
      plugins:{
        legend:{position:"bottom",labels:{color:text,font:{family:ff,size:12},padding:12,boxWidth:14}},

  // Row 3: Top Clientes Agrupados - horizontal bar full width

    },
    options:{
      indexAxis:"y",responsive:true,maintainAspectRatio:true,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>"R$ "+(ctx.raw/1000).toFixed(1)+"k"}}},
      scales:{
        x:{grid:{color:grid},ticks:{color:text,font:{family:ff},callback:v=>"R$ "+(v/1000).toFixed(0)+"k"}},
        y:{grid:{display:false},ticks:{color:text,font:{family:ff,size:12}}}

  // Row 4 left: Vendas por Marca (BRAND) - horizontal bar
  dChart("ch_brand");

  if(brE.length) charts["ch_brand"]=new Chart(document.getElementById("ch_brand"),{

  // Row 4 right: Vendas por Familia (FAMILY) - horizontal bar
  dChart("ch_family");
  const byFam={};

  const famE=Object.entries(byFam).sort(([,a],[,b])=>b-a);

    },

      indexAxis:"y",responsive:true,maintainAspectRatio:true,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>"R$ "+(ctx.raw/1000).toFixed(1)+"k"}}},
      scales:{
        x:{grid:{color:grid},ticks:{color:text,font:{family:ff},callback:v=>"R$ "+(v/1000).toFixed(0)+"k"}},
        y:{grid:{display:false},ticks:{color:text,font:{family:ff,size:12}}}
      }
    }
  });

  // Row 5: TOP 10 SKUs (Total NF) - horizontal bar full width
  dChart("ch_sku_top");
  const bySku={};
  rows.forEach(r=>{const s=r.sku||"(Sem SKU)";bySku[s]=(bySku[s]||0)+r.total_nf;});
  const skuE=Object.entries(bySku).sort(([,a],[,b])=>b-a).slice(0,10);
  if(skuE.length) charts["ch_sku_top"]=new Chart(document.getElementById("ch_sku_top"),{
    type:"bar",
    data:{
      labels:skuE.map(([k])=>k.length>35?k.slice(0,35)+"...":k),
      datasets:[{data:skuE.map(([,v])=>v),backgroundColor:"#06b6d4",borderRadius:4}]
    },
    options:{
      indexAxis:"y",responsive:true,maintainAspectRatio:true,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>"R$ "+(ctx.raw/1000).toFixed(1)+"k"}}},
      scales:{
        x:{grid:{color:grid},ticks:{color:text,font:{family:ff},callback:v=>"R$ "+(v/1000).toFixed(0)+"k"}},
        y:{grid:{display:false},ticks:{color:text,font:{family:ff,size:12}}}

    }
  });
}
function updateCharts(){
  const rows=getFiltered();
  if(activeTab==="overview") renderCharts(rows);
  else if(activeTab==="clientes") renderClientes(rows);
  else if(activeTab==="item") renderItem(rows);

const DET_COLS = [
  {k:"data",l:"DATA",fmt:v=>v?v.slice(8,10)+"/"+v.slice(5,7)+"/"+v.slice(0,4):"-"},
  {k:"nota_fiscal",l:"NF"},
  {k:"cliente_agrupado",l:"CLI. AGRUPADO",fmt:v=>`<span class="badge-green">${esc(v||"-")}</span>`},

  {k:"sku",l:"SKU"},
  {k:"quantidade",l:"QTD",nr:true,fmt:v=>R(v)},
  {k:"total_nf",l:"TOTAL NF",nr:true,fmt:v=>BRL(v)},
  {k:"total_liquido",l:"TOTAL LIQUIDO",nr:true,fmt:v=>BRL(v)},
];

let itemSubTab = "sku";  // "sku" | "brand" | "family"

function renderItem(rows){
  // Build sub-tab HTML
  const subTabs = [
    {id:"sku",   label:"Por SKU"},
    {id:"brand", label:"Por Marca (BRAND)"},
    {id:"family",label:"Por Familia (FAMILY)"},
  ];
  const subNav = subTabs.map(s=>`<button class="tab${itemSubTab===s.id?" active":""}" style="font-size:12px;padding:8px 14px" onclick="itemSubTab='${s.id}';renderItem(getFiltered())">${s.label}</button>`).join("");

  if(itemSubTab==="sku"){
    // Por SKU: aggregate by sku
    const bySku={};
    rows.forEach(r=>{
      const k=r.sku||"(Sem SKU)";
      if(!bySku[k]) bySku[k]={sku:k,brand:r.brand||"",family:r.family||"",quantidade:0,total_nf:0,total_liquido:0};
      bySku[k].quantidade+=r.quantidade||0;
      bySku[k].total_nf+=r.total_nf||0;
      bySku[k].total_liquido+=r.total_liquido||0;
    });
    const skuList=Object.values(bySku).sort((a,b)=>b.total_nf-a.total_nf);
    const skuTbody=skuList.map(s=>`<tr>
      <td>${esc(s.sku)}</td><td>${esc(s.brand)}</td><td>${esc(s.family)}</td>
      <td class="nr">${R(s.quantidade)}</td>
      <td class="nr">${BRL(s.total_nf)}</td>
      <td class="nr">${BRL(s.total_liquido)}</td>
    </tr>`).join("");
    const skuTot=`<tr class="tot"><td>TOTAL (${skuList.length} SKUs)</td><td></td><td></td>
      <td class="nr">${R(sum(skuList,"quantidade"))}</td>
      <td class="nr">${BRL(sum(skuList,"total_nf"))}</td>
      <td class="nr">${BRL(sum(skuList,"total_liquido"))}</td></tr>`;

    // Detail table (paginated)
    let sorted=[...rows].sort((a,b)=>{const av=a[sortCol],bv=b[sortCol];const c=av<bv?-1:av>bv?1:0;return sortDir==="asc"?c:-c;});
    const total=sorted.length;
    const maxP=Math.max(0,Math.ceil(total/PAGE_SIZE)-1);
    if(currentPage>maxP)currentPage=maxP;
    const paged=sorted.slice(currentPage*PAGE_SIZE,(currentPage+1)*PAGE_SIZE);
    const thead=DET_COLS.map(c=>`<th onclick="doSort('${c.k}')">${c.l}<span class="sa">${sortCol===c.k?(sortDir==="asc"?"&#8593;":"&#8595;"):"&#8645;"}</span></th>`).join("");
    const tbody=paged.map(r=>`<tr>${DET_COLS.map(c=>{const v=r[c.k];const disp=c.fmt?c.fmt(v):esc(v||"-");return `<td${c.nr?' class="nr"':""}>${disp}</td>`;}).join("")}</tr>`).join("")
      ||`<tr><td colspan="${DET_COLS.length}" style="text-align:center;padding:32px;opacity:.5">Nenhum registro</td></tr>`;
    const trow=`<tr class="tot"><td>TOTAL (${total})</td>`+DET_COLS.slice(1).map(c=>{
      if(c.k==="quantidade") return `<td class="nr">${R(sum(rows,c.k))}</td>`;
      if(c.k==="total_nf"||c.k==="total_liquido") return `<td class="nr">${BRL(sum(rows,c.k))}</td>`;
      return `<td></td>`;
    }).join("")+`</tr>`;

    document.getElementById("content").innerHTML=`
      <div class="content" style="padding-top:0">
        <div id="fbar" class="fbar"></div>
        <div style="display:flex;gap:4px;margin-bottom:10px">${subNav}</div>
        <div class="card" style="margin-bottom:14px">
          <div class="tbl-hdr"><h3>Resumo por SKU</h3></div>
          <div class="tbl-wrap">
            <table class="dt"><thead><tr><th>SKU</th><th>BRAND</th><th>FAMILY</th><th class="nr">Qtd Pecas</th><th class="nr">Total NF</th><th class="nr">Total Liquido</th></tr></thead>
            <tbody>${skuTbody}${skuTot}</tbody></table>
          </div>
        </div>
        <div class="card">
          <div class="tbl-hdr"><h3>Detalhe por Item</h3></div>
          <div class="tbl-wrap">
            <table class="dt"><thead><tr>${thead}</tr></thead><tbody>${tbody}${trow}</tbody></table>
          </div>
          <div class="tbl-foot">
            <span style="opacity:.6">${total} registros</span>
            <div class="pagination">
              <button class="btn-pg" id="btn-prev" onclick="changePage(-1)">&#8592; Anterior</button>
              <span style="opacity:.6;font-size:12px">${currentPage+1} / ${Math.max(1,Math.ceil(total/PAGE_SIZE))}</span>
              <button class="btn-pg" id="btn-next" onclick="changePage(1)">Proximo &#8594;</button>
            </div>
          </div>
        </div>
      </div>`;
    document.getElementById("btn-prev").disabled=currentPage===0;
    document.getElementById("btn-next").disabled=(currentPage+1)*PAGE_SIZE>=total;
    buildFbar();
  } else {
    // Por BRAND or FAMILY
    const dimKey = itemSubTab==="brand"?"brand":"family";
    const dimLabel = itemSubTab==="brand"?"Marca (BRAND)":"Familia (FAMILY)";
    const chartId = "ch_dim_"+itemSubTab;
    const byDim={};
    rows.forEach(r=>{
      const k=r[dimKey]||"Sem "+dimLabel;
      if(!byDim[k]) byDim[k]={dim:k,quantidade:0,total_nf:0,total_liquido:0};
      byDim[k].quantidade+=r.quantidade||0;
      byDim[k].total_nf+=r.total_nf||0;
      byDim[k].total_liquido+=r.total_liquido||0;
    });
    const dimList=Object.values(byDim).sort((a,b)=>b.total_nf-a.total_nf);
    const dimTbody=dimList.map(d=>`<tr>
      <td>${esc(d.dim)}</td>
      <td class="nr">${R(d.quantidade)}</td>
      <td class="nr">${BRL(d.total_nf)}</td>
      <td class="nr">${BRL(d.total_liquido)}</td>
    </tr>`).join("");
    const dimTot=`<tr class="tot"><td>TOTAL (${dimList.length})</td>
      <td class="nr">${R(sum(dimList,"quantidade"))}</td>
      <td class="nr">${BRL(sum(dimList,"total_nf"))}</td>
      <td class="nr">${BRL(sum(dimList,"total_liquido"))}</td></tr>`;

    document.getElementById("content").innerHTML=`
      <div class="content" style="padding-top:0">
        <div id="fbar" class="fbar"></div>
        <div style="display:flex;gap:4px;margin-bottom:10px">${subNav}</div>
        <div class="ov-row2" style="margin-bottom:14px">
          <div class="ov-panel" style="grid-column:1/-1">
            <div class="ov-panel-title">Por ${dimLabel} (Total NF)</div>
            <canvas id="${chartId}" height="160"></canvas>
          </div>
        </div>
        <div class="card">
          <div class="tbl-hdr"><h3>Resumo por ${dimLabel}</h3></div>
          <div class="tbl-wrap">
            <table class="dt"><thead><tr><th>${dimLabel}</th><th class="nr">Qtd Pecas</th><th class="nr">Total NF</th><th class="nr">Total Liquido</th></tr></thead>
            <tbody>${dimTbody}${dimTot}</tbody></table>
          </div>
        </div>
      </div>`;
    buildFbar();
    // Render chart
    const {grid,text,ff}=cs();
    dChart(chartId);
    if(dimList.length) charts[chartId]=new Chart(document.getElementById(chartId),{
      type:"bar",
      data:{
        labels:dimList.map(d=>d.dim.length>30?d.dim.slice(0,30)+"...":d.dim),
        datasets:[{data:dimList.map(d=>d.total_nf),backgroundColor:TB_COLORS.slice(0,dimList.length).map(c=>c+"cc"),borderColor:TB_COLORS.slice(0,dimList.length),borderWidth:1,borderRadius:4}]
      },
      options:{
        indexAxis:"y",responsive:true,maintainAspectRatio:true,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>"R$ "+(ctx.raw/1000).toFixed(1)+"k"}}},
        scales:{
          x:{grid:{color:grid},ticks:{color:text,font:{family:ff},callback:v=>"R$ "+(v/1000).toFixed(0)+"k"}},
          y:{grid:{display:false},ticks:{color:text,font:{family:ff,size:12}}}
        }
      }
    });
  }
}

// ── Aba Clientes ──────────────────────────────────────────────────────────
function renderClientes(rows){
  // 1. Agrupa por cliente_agrupado para o resumo superior
  const byAg={};
  rows.forEach(r=>{
    const k=r.cliente_agrupado||r.nome_fantasia||"-";
    if(!byAg[k]) byAg[k]={ag:k,nfs:new Set(),quantidade:0,total_nf:0,total_liquido:0};
    byAg[k].nfs.add(r.nota_fiscal);
    byAg[k].quantidade+=r.quantidade||0;
    byAg[k].total_nf+=r.total_nf||0;
    byAg[k].total_liquido+=r.total_liquido||0;
  });
  const agList=Object.values(byAg).sort((a,b)=>b.total_nf-a.total_nf);
  const agTbody=agList.map(a=>`<tr>
    <td><span class="badge-green">${esc(a.ag)}</span></td>
    <td class="nr">${a.nfs.size}</td>
    <td class="nr">${R(a.quantidade)}</td>
    <td class="nr">${BRL(a.total_nf)}</td>
    <td class="nr">${BRL(a.total_liquido)}</td>
  </tr>`).join("");
  const agTot=`<tr class="tot"><td>TOTAL (${agList.length} grupos)</td>
    <td class="nr">${agList.reduce((s,a)=>s+a.nfs.size,0)}</td>
    <td class="nr">${R(sum(agList,"quantidade"))}</td>
    <td class="nr">${BRL(sum(agList,"total_nf"))}</td>
    <td class="nr">${BRL(sum(agList,"total_liquido"))}</td></tr>`;

  // 2. Agrupa por razao_social para detalhe
  const byC={};
  rows.forEach(r=>{
    const k=r.razao_social||r.nome_fantasia||"-";
    if(!byC[k]) byC[k]={razao_social:k,cnpj:r.cnpj,cliente_agrupado:r.cliente_agrupado,gerente:r.gerente,
      total_nf:0,total_liquido:0,quantidade:0,icms_st:0,ipi:0,icms:0,pis:0,cofins:0,nfs:new Set()};
    byC[k].total_nf      += r.total_nf;

              <th class="nr">NFs</th><th class="nr">Qtd Pecas</th><th class="nr">Total NF</th><th class="nr">Total Liquido</th>

// ── Aba Impostos ──────────────────────────────────────────────────────────
function renderImpostos(rows){
  const totalNF  = sum(rows,"total_nf");
  const tipos=[
    {l:"ICMS",    k:"icms",    c:"#3b82f6"},
    {l:"IPI",     k:"ipi",     c:"#f59e0b"},
    {l:"ICMS ST", k:"icms_st", c:"#10b981"},
    {l:"PIS",     k:"pis",     c:"#8b5cf6"},
    {l:"COFINS",  k:"cofins",  c:"#f97316"},
  ];
  const cards=tipos.map(t=>{
    const v=sum(rows,t.k);
    const pct=totalNF>0?((v/totalNF)*100).toFixed(1):"0";
    return `<div class="imp-card" style="border-left:3px solid ${t.c}">
      <div class="imp-label">${t.l}</div>
      <div class="imp-value" style="color:${t.c}">${BRL(v)}</div>
      <div class="imp-pct">${pct}% do Total NF</div>
    </div>`;
  }).join("");

  // Por gerente
  const byGer={};
  rows.forEach(r=>{
    const g=r.gerente||"Sem Gerente";
    if(!byGer[g]) byGer[g]={gerente:g,total_nf:0,total_liquido:0,icms_st:0,ipi:0,icms:0,pis:0,cofins:0};
    ["total_nf","total_liquido","icms_st","ipi","icms","pis","cofins"].forEach(k=>byGer[g][k]+=r[k]||0);
  });
  const gerList=Object.values(byGer).sort((a,b)=>b.total_nf-a.total_nf);
  const gerRows=gerList.map(g=>`<tr>
    <td><span class="badge-blue">${esc(g.gerente)}</span></td>
    <td class="nr">${BRL(g.total_nf)}</td>
    <td class="nr">${BRL(g.icms)}</td>
    <td class="nr">${BRL(g.ipi)}</td>
    <td class="nr">${BRL(g.icms_st)}</td>
    <td class="nr">${BRL(g.pis)}</td>
    <td class="nr">${BRL(g.cofins)}</td>
    <td class="nr">${BRL(g.total_liquido)}</td>
  </tr>`).join("");

  document.getElementById("content").innerHTML=`
    <div class="content" style="padding-top:0">
      <div id="fbar" class="fbar"></div>
      <div class="card">
        <div class="tbl-hdr"><h3>Detalhamento de Impostos</h3></div>
        <div class="imp-grid">${cards}</div>
        <div style="margin-top:18px">
          <div class="tbl-hdr"><h3>Por Gerente</h3></div>
          <div class="tbl-wrap">
            <table class="dt"><thead><tr>
              <th>Gerente</th><th class="nr">Total NF</th><th class="nr">ICMS</th><th class="nr">IPI</th>
              <th class="nr">ICMS ST</th><th class="nr">PIS</th><th class="nr">COFINS</th><th class="nr">Total Liquido</th>
            </tr></thead><tbody>${gerRows}</tbody></table>
          </div>
        </div>
      </div>
    </div>`;
  buildFbar();
}

// ── Aba Acumulado Ano ──────────────────────────────────────────────────────
const SITU_ORDER  = ["Autorizado","Devolvido Parcialmente","Devolvido","Cancelado"];
const SITU_COLOR  = {"Autorizado":"#10b981","Cancelado":"#ef4444","Devolvido":"#f59e0b","Devolvido Parcialmente":"#8b5cf6"};
const SITU_LABEL  = {"Autorizado":"Faturado (Autorizado)","Cancelado":"Cancelado","Devolvido":"Devolvido","Devolvido Parcialmente":"Dev. Parcialmente"};
const MON_NAMES   = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

let _acCharts = {};
function _destroyAcCharts(){
  Object.values(_acCharts).forEach(c=>{try{c.destroy();}catch(e){}});
  _acCharts={};
}

function renderAcumulado(){
  if(typeof Chart==="undefined") return;
  _destroyAcCharts();
  const rows = ALL; // todos os dados do ano
  const {grid,text,ff} = cs();

  // ── Build month list (sorted)
  const months = [...new Set(rows.map(r=>r.data.slice(0,7)))].filter(Boolean).sort();
  const mLabels = months.map(m=>MON_NAMES[parseInt(m.slice(5,7))-1]+"/"+m.slice(2,4));

  // ── Aggregate by situação
  const bySitu = {};
  SITU_ORDER.forEach(s=>bySitu[s]={total_nf:0,total_liq:0,qtd:0,notas:new Set()});
  rows.forEach(r=>{
    const s = r.situacao || "Outro";
    if(!bySitu[s]) bySitu[s]={total_nf:0,total_liq:0,qtd:0,notas:new Set()};
    bySitu[s].total_nf += r.total_nf||0;
    bySitu[s].total_liq += r.total_liquido||0;
    bySitu[s].qtd       += r.quantidade||0;
    bySitu[s].notas.add(r.nota_fiscal);
  });

  // ── Monthly matrix: month -> situ -> total_nf
  const monthly = {};
  months.forEach(m=>{ monthly[m]={}; SITU_ORDER.forEach(s=>monthly[m][s]=0); });
  rows.forEach(r=>{
    const m=r.data.slice(0,7);
    const s=r.situacao||"Outro";
    if(monthly[m] && monthly[m][s]!==undefined) monthly[m][s]+=r.total_nf||0;
  });

  // totalAll usado no renderKPIs (topo da pagina ja mostra os cards por situacao)

  // ── Monthly table rows
  const tblRows = months.map((m,i)=>{
    const auth=monthly[m]["Autorizado"]||0;
    const canc=monthly[m]["Cancelado"]||0;
    const dev=monthly[m]["Devolvido"]||0;
    const devp=monthly[m]["Devolvido Parcialmente"]||0;
    const tot=auth+canc+dev+devp;
    return `<tr>
      <td><strong>${mLabels[i]}</strong></td>
      <td class="nr" style="color:#10b981">${BRL(auth)}</td>
      <td class="nr" style="color:#8b5cf6">${BRL(devp)}</td>
      <td class="nr" style="color:#f59e0b">${BRL(dev)}</td>
      <td class="nr" style="color:#ef4444">${BRL(canc)}</td>
      <td class="nr"><strong>${BRL(tot)}</strong></td>
    </tr>`;
  }).join("");

  // ── Gerente breakdown for Autorizado
  const authRows = rows.filter(r=>r.situacao==="Autorizado");
  const byGer={};
  authRows.forEach(r=>{
    const g=r.gerente||"Sem Gerente";
    if(!byGer[g]) byGer[g]={gerente:g,total_nf:0,total_liq:0,qtd:0};
    byGer[g].total_nf+=r.total_nf||0;
    byGer[g].total_liq+=r.total_liquido||0;
    byGer[g].qtd+=r.quantidade||0;
  });
  const gerList=Object.values(byGer).sort((a,b)=>b.total_nf-a.total_nf);
  const gerRows=gerList.map(g=>`<tr>
    <td><span class="badge-blue">${esc(g.gerente)}</span></td>
    <td class="nr" style="color:#10b981">${BRL(g.total_nf)}</td>
    <td class="nr">${BRL(g.total_liq)}</td>
    <td class="nr">${R(g.qtd)}</td>
  </tr>`).join("");

  // ── Top 15 clientes (Autorizado) + OUTROS
  const byCli={};
  authRows.forEach(r=>{
    const c=r.cliente_agrupado||r.razao_social||"Desconhecido";
    if(!byCli[c]) byCli[c]=0;
    byCli[c]+=r.total_nf||0;
  });
  const cliAll=Object.entries(byCli).sort((a,b)=>b[1]-a[1]);
  const TOP_N=15;
  const cliTop=cliAll.slice(0,TOP_N);
  const cliOutros=cliAll.slice(TOP_N).reduce((s,x)=>s+x[1],0);
  if(cliOutros>0) cliTop.push(["OUTROS",cliOutros]);
  const cliLabels=cliTop.map(x=>x[0]);
  const cliData  =cliTop.map(x=>Math.round(x[1]));
  const cliColors=cliTop.map((_,i)=>i===cliTop.length-1&&cliOutros>0?"#475569":"#3b82f6");

  // ── Top 20 SKUs (Autorizado, usando campo sku = SKU 2 da masterdata)
  const bySku={};
  authRows.forEach(r=>{
    const s=r.sku||r.codigo_produto||"Sem SKU";
    if(!bySku[s]) bySku[s]={sku:s,total_nf:0,qtd:0};
    bySku[s].total_nf+=r.total_nf||0;
    bySku[s].qtd+=r.quantidade||0;
  });
  const skuAll=Object.values(bySku).sort((a,b)=>b.total_nf-a.total_nf);
  const TOP_SKU=20;
  const skuTop=skuAll.slice(0,TOP_SKU);
  const skuLabels=skuTop.map(x=>x.sku);
  const skuData  =skuTop.map(x=>Math.round(x.total_nf));
  const skuQtd   =skuTop.map(x=>x.qtd);

  document.getElementById("content").innerHTML=`
    <div class="content" style="padding-top:0">
      <div class="ov-row2" style="margin-bottom:14px">
        <div class="ov-panel">
          <div class="ov-panel-title">Distribuicao por Situacao (Total NF)</div>
          <canvas id="ch_ac_pizza" height="280"></canvas>
        </div>
        <div class="ov-panel">
          <div class="ov-panel-title">Evolucao Mensal por Situacao</div>
          <canvas id="ch_ac_mensal" height="280"></canvas>
        </div>
      </div>
      <div class="card" style="margin-bottom:14px">
        <div class="tbl-hdr"><h3>Tabela Mensal por Situacao</h3></div>
        <div class="tbl-wrap"><table class="dt"><thead><tr>
          <th>Mes</th>
          <th class="nr" style="color:#10b981">Faturado</th>
          <th class="nr" style="color:#8b5cf6">Dev. Parcial</th>
          <th class="nr" style="color:#f59e0b">Devolvido</th>
          <th class="nr" style="color:#ef4444">Cancelado</th>
          <th class="nr">Total</th>
        </tr></thead><tbody>${tblRows}</tbody></table></div>
      </div>
      <div class="ov-row2" style="margin-bottom:14px">
        <div class="ov-panel" style="flex:1.2">
          <div class="ov-panel-title">Top 15 Clientes &mdash; Faturado (Total NF)</div>
          <canvas id="ch_ac_cli" height="420"></canvas>
        </div>
        <div class="ov-panel" style="flex:1">
          <div class="ov-panel-title">Top 20 SKUs &mdash; Faturado (Total NF)</div>
          <canvas id="ch_ac_sku" height="420"></canvas>
        </div>
      </div>
      <div class="card">
        <div class="tbl-hdr"><h3>Faturado (Autorizado) por Gerente &mdash; Acumulado</h3></div>
        <div class="tbl-wrap"><table class="dt"><thead><tr>
          <th>Gerente</th>
          <th class="nr">Total NF</th>
          <th class="nr">Total Liquido</th>
          <th class="nr">Qtd Pecas</th>
        </tr></thead><tbody>${gerRows}</tbody></table></div>
      </div>
    </div>`;

  // Donut — distribuição por situação
  const pizza_labels = SITU_ORDER.filter(s=>bySitu[s]&&bySitu[s].total_nf>0);
  const pizza_data   = pizza_labels.map(s=>Math.round(bySitu[s].total_nf));
  const pizza_colors = pizza_labels.map(s=>SITU_COLOR[s]||"#94a3b8");
  _acCharts.pizza = new Chart(document.getElementById("ch_ac_pizza").getContext("2d"),{
    type:"doughnut",
    data:{labels:pizza_labels.map(s=>SITU_LABEL[s]||s),datasets:[{data:pizza_data,backgroundColor:pizza_colors,borderWidth:2,borderColor:"#0a0e1a"}]},
    options:{
      responsive:true,maintainAspectRatio:false,cutout:"60%",
      plugins:{legend:{labels:{color:text,font:{family:ff,size:12}}},
        tooltip:{callbacks:{label:ctx=>" "+ctx.label+": "+BRL(ctx.raw)}}
      }
    }
  });

  // Stacked bar — evolução mensal por situação
  const bar_datasets = SITU_ORDER.map(s=>{
    const d=months.map(m=>Math.round(monthly[m][s]||0));
    return {label:SITU_LABEL[s]||s,data:d,backgroundColor:SITU_COLOR[s]||"#94a3b8",borderRadius:3};
  });
  _acCharts.mensal = new Chart(document.getElementById("ch_ac_mensal").getContext("2d"),{
    type:"bar",
    data:{labels:mLabels,datasets:bar_datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:text,font:{family:ff,size:12}}},
        tooltip:{callbacks:{label:ctx=>" "+ctx.dataset.label+": "+BRL(ctx.raw)}}
      },
      scales:{
        x:{stacked:true,grid:{color:grid},ticks:{color:text,font:{family:ff,size:11}}},
        y:{stacked:true,grid:{color:grid},ticks:{color:text,font:{family:ff,size:11},callback:v=>"R$"+Math.round(v/1000)+"k"}}
      }
    }
  });

  // Horizontal bar — Top 15 clientes + OUTROS
  _acCharts.cli = new Chart(document.getElementById("ch_ac_cli").getContext("2d"),{
    type:"bar",
    data:{
      labels:cliLabels,
      datasets:[{
        label:"Total NF",data:cliData,

  // Horizontal bar — Top 20 SKUs
  _acCharts.sku = new Chart(document.getElementById("ch_ac_sku").getContext("2d"),{
    type:"bar",
    data:{
      labels:skuLabels,
      datasets:[{
        label:"Total NF",data:skuData,
        backgroundColor:"#f59e0b",borderRadius:3

    options:{
      indexAxis:"y",responsive:true,maintainAspectRatio:false,

      scales:{

        y:{grid:{display:false},ticks:{color:text,font:{family:ff,size:11}}}

}

// ── Aba Estoque ───────────────────────────────────────────────────────────
function buildEstFbar(){
  const bOpts = [...new Set(STOCK_AGG.map(r=>r.brand).filter(Boolean))].sort();
  const fOpts = [...new Set(STOCK_AGG.map(r=>r.family).filter(Boolean))].sort();
  const cOpts = [...new Set(STOCK_AGG.map(r=>r.category).filter(Boolean))].sort();
  function selHtml(arr, opts, key, label){
    const allOpt = `<option value="">-- ${label} --</option>`;
    const items  = opts.map(o=>`<option value="${esc(o)}" ${arr.includes(o)?'selected':''}>${esc(o)}</option>`).join('');
    return `<select class="filter-select" style="padding:6px 8px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer"
      onchange="EST.${key}=this.value?[this.value]:[];renderEstoque()">${allOpt+items}</select>`;
  }
  const hasSel = EST.brand.length||EST.family.length||EST.category.length||EST.search;
  const filt2  = STOCK_AGG.filter(s=>
    (!EST.brand.length||EST.brand.includes(s.brand))&&
    (!EST.family.length||EST.family.includes(s.family))&&
    (!EST.category.length||EST.category.includes(s.category))&&
    (!EST.search||(s.sku+s.description+s.brand+s.family+s.category).toLowerCase().includes(EST.search.toLowerCase()))
  );
  const totCostFilt = filt2.reduce((s,r)=>s+(r.cost_total||0),0);
  document.getElementById('est-fbar').innerHTML = `
    <i class="bi bi-search" style="color:#64748b"></i>
    <input class="fbar-search" type="text" placeholder="Buscar SKU, marca, familia..." value="${esc(EST.search)}"
      oninput="EST.search=this.value;renderEstoque()">
    ${selHtml(EST.brand,    bOpts, 'brand',    'Marca')}
    ${selHtml(EST.family,   fOpts, 'family',   'Familia')}
    ${selHtml(EST.category, cOpts, 'category', 'Categoria')}
    ${hasSel?`<button class="fbar-reset" onclick="EST.brand=[];EST.family=[];EST.category=[];EST.search='';renderEstoque()">x Limpar</button>`:''}
    <span class="cnt-badge">${filt2.length} SKUs &middot; R$ ${R(totCostFilt)}</span>`;
}

function _renderEstSubTabs(){
  if(!STOCK_SUBLIMITY || STOCK_SUBLIMITY.length === 0) return '';
  const isDark = document.body.classList.contains('dark');
  const activeStyle = 'background:#f59e0b;color:#0a0e1a;border-color:#f59e0b;font-weight:700';
  const inactiveStyle = isDark
    ? 'background:#1e293b;color:#94a3b8;border:1px solid #334155'
    : 'background:#e2e8f0;color:#475569;border:1px solid #cbd5e1';
  const sublLabel = 'Sublimity (' + STOCK_SUBLIMITY.reduce((s,r)=>s+(r.qty||0),0).toLocaleString('pt-BR') + ' pcs)';
  return `<div style="display:flex;gap:8px;padding:10px 4px 6px">
    <button onclick="estSubTab='tb';renderEstoque()"
      style="padding:6px 18px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;${estSubTab==='tb'?activeStyle:inactiveStyle}">
      Estoque TB
    </button>
    <button onclick="estSubTab='sublimity';renderEstoque()"
      style="padding:6px 18px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;${estSubTab==='sublimity'?activeStyle:inactiveStyle}">
      ${sublLabel}
    </button>
  </div>`;
}

function renderEstoque(){
  if(estSubTab === 'sublimity') {
    const FMT2 = v => Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    const totQty  = (STOCK_SUBLIMITY||[]).reduce((s,r)=>s+(r.qty||0),0);
    const totCost = (STOCK_SUBLIMITY||[]).reduce((s,r)=>s+(r.cost_total||0),0);
    const tbody = (STOCK_SUBLIMITY||[]).map(s=>`<tr>
      <td>${esc(s.sku||s.sku_system)}</td>
      <td>${esc(s.brand)}</td>
      <td>${esc(s.family)}</td>
      <td>${esc(s.category)}</td>
      <td class="nr">${R(s.qty)}</td>
      <td class="nr">R$ ${FMT2(s.cost_unit)}</td>
      <td class="nr">R$ ${R(s.cost_total)}</td>
    </tr>`).join('');
    const totRow = `<tr class="tot">
      <td>TOTAL (${(STOCK_SUBLIMITY||[]).length} SKUs)</td><td></td><td></td><td></td>
      <td class="nr">${R(totQty)}</td>
      <td class="nr">—</td>
      <td class="nr">R$ ${R(totCost)}</td>
    </tr>`;
    document.getElementById('content').innerHTML = `
      <div class="content" style="padding-top:0">
        ${_renderEstSubTabs()}
        <div class="card">
          <div class="tbl-hdr">
            <h3>Estoque Sublimity (Consignacao) &mdash; ${(STOCK_SUBLIMITY||[]).length} SKUs &middot; ${R(totQty)} pcs &middot; R$ ${R(totCost)}</h3>
          </div>
          <div class="tbl-wrap">
            <table class="dt">
              <thead><tr>
                <th>SKU</th><th>MARCA</th><th>FAMILIA</th><th>CATEGORIA</th>
                <th class="nr">Qtd (pcs)</th>
                <th class="nr">Custo Unit.</th>
                <th class="nr">Custo Total</th>
              </tr></thead>
              <tbody>${totRow}${tbody}${totRow}</tbody>
            </table>
          </div>
        </div>
      </div>`;
    return;
  }
  // ── Sub-aba TB (padrao) ────────────────────────────────────────────────────
  const q = EST.search.toLowerCase();
  const filt = STOCK_AGG.filter(s =>
    (!EST.brand.length    || EST.brand.includes(s.brand))    &&
    (!EST.family.length   || EST.family.includes(s.family))  &&
    (!EST.category.length || EST.category.includes(s.category)) &&
    (!q || (s.sku+s.description+s.brand+s.family+s.category).toLowerCase().includes(q))
  );
  // Sort by quantidade vendida em 2026 (Autorizado), maior para menor
  filt.sort((a,b)=>(_skuTotalSales2026[b.sku]||0)-(_skuTotalSales2026[a.sku]||0));
  const FMT2 = v => Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const FMT1 = v => Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
  const FMT0 = v => Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
  const tbody = filt.map(s=>{
    const qty   = s.qty||0;
    const cu    = s.cost_unit||0;
    const ct    = s.cost_total||0;
    const sold  = _skuTotalSales2026[s.sku]||0;
    const avg   = _skuAvgSales[s.sku]||0;
    const cov   = avg>0 ? qty/avg : null;
    const covStr = cov===null ? '—' : FMT1(cov)+' m';
    const covClr = cov===null?'':cov<1?'color:#ef4444':cov<2?'color:#f59e0b':'color:#10b981';
    return `<tr>
      <td>${esc(s.sku)}</td>
      <td>${esc(s.brand)}</td>
      <td>${esc(s.family)}</td>
      <td>${esc(s.category)}</td>
      <td class="nr">${R(qty)}</td>
      <td class="nr">${R(sold)}</td>
      <td class="nr">${R(avg)}</td>
      <td class="nr" style="${covClr}">${covStr}</td>
      <td class="nr">R$ ${FMT2(cu)}</td>
      <td class="nr">R$ ${FMT0(ct)}</td>
    </tr>`;
  }).join('');
  const totQty  = filt.reduce((s,r)=>s+(r.qty||0),0);
  const totSold = filt.reduce((s,r)=>s+(_skuTotalSales2026[r.sku]||0),0);
  const totCost = filt.reduce((s,r)=>s+(r.cost_total||0),0);
  const totAvg  = filt.reduce((s,r)=>s+(_skuAvgSales[r.sku]||0),0);
  const totCov  = totAvg>0 ? totQty/totAvg : null;
  const totCovStr = totCov===null ? '—' : FMT1(totCov)+' m';
  const totCovClr = totCov===null?'':totCov<1?'color:#ef4444':totCov<2?'color:#f59e0b':'color:#10b981';
  const totRow = `<tr class="tot">
    <td>TOTAL (${filt.length} SKUs)</td><td></td><td></td><td></td>
    <td class="nr">${R(totQty)}</td>
    <td class="nr">${R(totSold)}</td>
    <td class="nr">${R(totAvg)}</td>
    <td class="nr" style="${totCovClr}">${totCovStr}</td>
    <td class="nr">—</td><td class="nr">R$ ${FMT0(totCost)}</td>
  </tr>`;
  document.getElementById('content').innerHTML = `
    <div class="content" style="padding-top:0">
      ${_renderEstSubTabs()}
      <div id="est-fbar" class="fbar"></div>
      <div class="card">
        <div class="tbl-hdr">
          <h3>Posicao de Estoque &mdash; Media de vendas calculada com base em ${_avgMonthLabel} &divide; ${_avgBaseMonths} (Autorizado, exclui mes vigente) &middot; ordenado por Qtd Vendida 2026</h3>
        </div>
        <div class="tbl-wrap">
          <table class="dt">
            <thead><tr>
              <th>SKU</th><th>MARCA</th><th>FAMILIA</th><th>CATEGORIA</th>
              <th class="nr">Estoque (pcs)</th>
              <th class="nr">Qtd Vendida 2026</th>
              <th class="nr">Media Vnd/Mes</th>
              <th class="nr">Cobertura</th>
              <th class="nr">Custo Unit.</th>
              <th class="nr">Custo Total</th>
            </tr></thead>
            <tbody>${totRow}${tbody}${totRow}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  buildEstFbar();
}

// ── Navegacao ──────────────────────────────────────────────────────────────
function initNav(){
  document.querySelectorAll(".tab").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      activeTab=btn.dataset.t;
      currentPage=0;
      refresh();
    });
  });
}

function refresh(){
  const rows=getFiltered();
  renderKPIs(rows);
  if(activeTab==="overview") renderOverview(rows);
  else if(activeTab==="item") renderItem(rows);
  else if(activeTab==="clientes") renderClientes(rows);
  else if(activeTab==="impostos") renderImpostos(rows);
  else if(activeTab==="acumulado") renderAcumulado();
  else if(activeTab==="estoque") renderEstoque();
}

function doSort(col){
  if(sortCol===col) sortDir=sortDir==="asc"?"desc":"asc";
  else {sortCol=col;sortDir="asc";}
  refresh();
}
function changePage(d){ currentPage+=d; refresh(); }

// ── Init ───────────────────────────────────────────────────────────────────
// window.onload garante que Chart.js (CDN) ja carregou antes de renderizar
function _init(){ initNav(); refresh(); }
if (document.readyState === 'complete') _init();
else window.addEventListener('load', _init);

// ── AG: Filtro de Mes ──────────────────────────────────────────
const _MONTHS_AG = [...new Set(ALL.map(r=>r.data?r.data.slice(0,7):'').filter(Boolean))].sort();
const _MON_AG = {'01':'Jan','02':'Fev','03':'Mar','04':'Abr','05':'Mai','06':'Jun',
                 '07':'Jul','08':'Ago','09':'Set','10':'Out','11':'Nov','12':'Dez'};
let selMonths = new Set();

// Redefine getFiltered: remove restricao de mes vigente, usa selMonths
getFiltered = function() {
  const q = F.search.toLowerCase();
  return ALL.filter(r =>
    (!selMonths.size || selMonths.has(r.data.slice(0,7))) &&
    (!F.data     || r.data.slice(8,10) === F.data) &&
    (!F.gerente.length  || F.gerente.includes(r.gerente)) &&
    (!F.vendedor.length || F.vendedor.includes(r.vendedor)) &&
    (!F.agrupado.length || F.agrupado.includes(r.cliente_agrupado)) &&
    (!F.razao.length    || F.razao.includes(r.razao_social)) &&
    (!q || Object.values(r).some(v=>String(v).toLowerCase().includes(q)))
  );
};

function renderMonthChips() {
  const el = document.getElementById('month-chips');
  if (!el) return;
  const none = selMonths.size === 0;
  let h = '<button class="mchip ' + (none?'active':'') + '" onclick="toggleMonth(null)">Todos</button>';
  for (const m of _MONTHS_AG) {
    const parts = m.split('-'), y = parts[0], mo = parts[1];
    const on = selMonths.has(m);
    h += '<button class="mchip ' + (on?'active':'') + '" onclick="toggleMonth(\'' + m + '\')">'
       + _MON_AG[mo] + ' ' + y.slice(2) + '</button>';
  }
  el.innerHTML = h;
}

function toggleMonth(m) {
  if (m === null) { selMonths.clear(); }
  else if (selMonths.has(m)) { selMonths.delete(m); }
  else { selMonths.add(m); }
  currentPage = 0;
  renderMonthChips();
  refresh();
}

// Re-renderizar chips quando tema muda
if (typeof toggleTheme !== 'undefined') {
  const _tOrig = toggleTheme;
  toggleTheme = function() { _tOrig(); renderMonthChips(); };
}

// Init: render chips e refresh com todos os meses
renderMonthChips();
refresh();
