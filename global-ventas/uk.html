  const m=S.months.filter(x=>!maxM||x<=maxM);
  if(!m.length)return'–';
  const cont=m.every((v,i)=>!i||v===m[i-1]+1);
  return cont?(m.length===1?MONTHS_EN[m[0]]:MONTHS_EN[m[0]]+'–'+MONTHS_EN[m[m.length-1]]):m.map(x=>MONTHS_EN[x]).join('+');
}
function subCfg(rg,sub){return rg&&sub?RGCFG[rg].subs.find(s=>s.key===sub):null;}
function subLabel(rg,k){const c=subCfg(rg,k);return(c.flag?c.flag+' ':'')+c.label;}
function scopeFn(rg,sub){
  if(!rg)return()=>true;
  const R=RGCFG[rg],f=R.match.f,vs=new Set(R.match.v),sc=subCfg(rg,sub);
  if(!sc)return r=>vs.has(r[f]);
  const sf=sc.f,ss=new Set(sc.v);return r=>vs.has(r[f])&&ss.has(r[sf]);
}
// UK SALES Business Plan is set per manager: no BP for a branch view
function bpOn(rg,sub){if(!rg)return true;if(RGCFG[rg].bp===false)return false;const sc=subCfg(rg,sub);return !sc||sc.bp!==false;}
function applyFilters(r){
  return S.months.includes(r.m)&&
    (!S.c2.length||S.c2.includes(r.c2))&&(!S.ch.length||S.ch.includes(r.ch))&&
    (!S.br.length||S.br.includes(r.br))&&(!S.fp.length||S.fp.includes(r.fp))&&
    (!S.cat.length||S.cat.includes(r.cat))&&(!S.sku.length||S.sku.includes(r.sku));
}
function pick(year,typ,rg,sub){const fn=scopeFn(rg,sub);return ROWS.filter(r=>r.t===typ&&r.y===year&&fn(r)&&applyFilters(r));}
const sumM=rows=>rows.reduce((a,r)=>a+r[S.measure],0);
function groupBy(rows,f){const m={};for(const r of rows){const k=r[f]||'(blank)';m[k]=(m[k]||0)+r[S.measure];}return m;}

// ── table model (shared by screen and Excel) ───────────────────────────────
function dimModel(field,label,rg,sub,hasBP,topN){
  hasBP=hasBP&&bpOn(rg,sub);
  const g0=groupBy(pick(Y0,'R',rg,sub),field),g1=groupBy(pick(Y1,'R',rg,sub),field),g2=groupBy(pick(CY,'R',rg,sub),field);
  const gb=hasBP?groupBy(pick(CY,'B',rg,sub),field):{};
  const keys=new Set([...Object.keys(g0),...Object.keys(g1),...Object.keys(g2),...(hasBP?Object.keys(gb):[])]);
  let rows=[...keys].map(k=>({k,a:g0[k]||0,b:g1[k]||0,c:g2[k]||0,p:gb[k]||0})).filter(r=>r.a||r.b||r.c||r.p);
  rows.sort((x,y)=>y.c-x.c);
  const total=rows.length;
  if(topN)rows=rows.slice(0,topN);
  const T={a:0,b:0,c:0,p:0};rows.forEach(r=>{T.a+=r.a;T.b+=r.b;T.c+=r.c;T.p+=r.p;});
  const cols=[{h:label,type:'txt'},{h:String(Y0),type:'num'},{h:String(Y1),type:'num'},{h:'% YoY',type:'pct'},{h:String(CY),type:'num'},{h:'% YoY',type:'pct'}];
  if(hasBP)cols.push({h:'BP '+CY,type:'num'},{h:'% vs BP',type:'pct'});
  cols.push({h:"Share '"+String(Y1).slice(2),type:'pct'},{h:"Share '"+String(CY).slice(2),type:'pct'});
  const line=(k,r)=>{const v=[k,r.a,r.b,pct(r.b,r.a),r.c,pct(r.c,r.b)];if(hasBP)v.push(r.p,pct(r.c,r.p));v.push(T.b?r.b/T.b:null,T.c?r.c/T.c:null);return v;};
  return{cols,body:rows.map(r=>line(r.k,r)),foot:line(topN?`TOTAL (Top ${topN})`:'TOTAL',T),total,topN,bold:4};
}
function tbSkuModel(){
  const isTB=r=>r.br==='TRAVEL BLUE';
  const r0=pick(Y0,'R').filter(isTB),r1=pick(Y1,'R').filter(isTB),r2=pick(CY,'R').filter(isTB);
  const g0=groupBy(r0,'sku'),g1=groupBy(r1,'sku'),g2=groupBy(r2,'sku');
  let rows=[...new Set([...Object.keys(g0),...Object.keys(g1),...Object.keys(g2)])].map(k=>({k,a:g0[k]||0,b:g1[k]||0,c:g2[k]||0})).filter(r=>r.a||r.b||r.c);
  rows.sort((x,y)=>y.c-x.c);rows=rows.slice(0,50);
  const T={a:0,b:0,c:0};rows.forEach(r=>{T.a+=r.a;T.b+=r.b;T.c+=r.c;});
  const bnTot={},bnSku={};
  BN_KEYS.forEach(bn=>{const br=r2.filter(r=>r.bn===bn);bnTot[bn]=sumM(br);bnSku[bn]=groupBy(br,'sku');});
  const cols=[{h:'SKU (Travel Blue)',type:'txt'},{h:String(Y0),type:'num'},{h:String(Y1),type:'num'},{h:'% YoY',type:'pct'},{h:String(CY),type:'num'},{h:'% YoY',type:'pct'},{h:"Share '"+String(Y1).slice(2),type:'pct'},{h:"Share '"+String(CY).slice(2),type:'pct'}]
    .concat(BN_KEYS.map(bn=>({h:BNCFG[bn].label+' %',type:'pct',bn})));
  const line=(k,r,isTot)=>[k,r.a,r.b,pct(r.b,r.a),r.c,pct(r.c,r.b),T.b?r.b/T.b:null,T.c?r.c/T.c:null]
    .concat(BN_KEYS.map(bn=>bnTot[bn]>0?(isTot?1:(bnSku[bn][k]||0)/bnTot[bn]):null));
  return{cols,body:rows.map(r=>line(r.k,r,false)),foot:line('TOTAL (Top 50)',T,true),total:rows.length,topN:50,bold:4};
}
function cellHtml(v,type){if(type==='txt')return String(v);if(type==='num')return fmtN(v);if(v==null)return'–';return fmtPct(v);}
function tableHtml(title,model,color){
  const hdr='<tr>'+model.cols.map(c=>c.bn?`<th class="bh" style="background:${BNCFG[c.bn].color}">${BNCFG[c.bn].flag}<br>${BNCFG[c.bn].label}</th>`:`<th>${c.h.replace(/ /g,'&nbsp;')}</th>`).join('')+'</tr>';
  const row=(v,isFoot)=>'<tr'+(isFoot?' class="total-row"':'')+'>'+v.map((x,i)=>{
    const c=model.cols[i];
    if(i===0)return`<td title="${String(x).replace(/"/g,'&quot;')}">${x}</td>`;
    if(c.bn)return`<td class="bc">${x==null?'–':(x*100).toFixed(1)+'%'}</td>`;
    let h=c.type==='pct'&&c.h.startsWith('Share')?(x==null?'–':fmtShare(x)):cellHtml(x,c.type);
    if(i===model.bold&&!isFoot)h=`<strong>${h}</strong>`;
    return`<td>${h}</td>`;}).join('')+'</tr>';
  const note=model.topN&&model.total>model.topN?`<p class="muted">Showing Top ${model.topN} of ${model.total} by ${CY} value</p>`:'';
  return`<div class="tbl-box"><h3${color?` style="color:${color}"`:''}>${title}</h3><div class="tbl-wrap"><table><thead>${hdr}</thead><tbody>${model.body.map(v=>row(v,false)).join('')}</tbody><tfoot>${row(model.foot,true)}</tfoot></table></div>${note}</div>`;
}

// ── multi-select dropdowns ─────────────────────────────────────────────────
const MS_DEFS=[{id:'msC2',sk:'c2',ph:'All Customers'},{id:'msCh',sk:'ch',ph:'All Channels'},{id:'msBr',sk:'br',ph:'All Brands'},{id:'msFp',sk:'fp',ph:'All Families'},{id:'msCat',sk:'cat',ph:'All Categories'},{id:'msSku',sk:'sku',ph:'All SKUs'}];
MS_DEFS.forEach(d=>{
  document.getElementById(d.id).innerHTML=`<button class="ms-btn">${d.ph} ▾</button><div class="ms-drop"><div class="ms-head"><input class="ms-search" placeholder="Search..."><button class="ms-all">All</button><button class="ms-clear">Clear</button></div><div class="ms-opts"></div></div>`;
  const root=document.getElementById(d.id),drop=root.querySelector('.ms-drop');
  root.querySelector('.ms-btn').addEventListener('click',e=>{e.stopPropagation();const open=drop.classList.contains('open');document.querySelectorAll('.ms-drop').forEach(x=>x.classList.remove('open'));if(!open)drop.classList.add('open');});
  drop.addEventListener('click',e=>e.stopPropagation());
  root.querySelector('.ms-search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();root.querySelectorAll('.ms-opt').forEach(o=>o.style.display=o.dataset.val.toLowerCase().includes(q)?'':'none');});
  root.querySelector('.ms-clear').addEventListener('click',()=>{S[d.sk]=[];root.querySelectorAll('.ms-opt input').forEach(c=>c.checked=false);updateMsBtn(d);render();});
  root.querySelector('.ms-all').addEventListener('click',()=>{const vis=[...root.querySelectorAll('.ms-opt')].filter(o=>o.style.display!=='none');S[d.sk]=vis.map(o=>o.dataset.val);root.querySelectorAll('.ms-opt').forEach(o=>o.querySelector('input').checked=S[d.sk].includes(o.dataset.val));updateMsBtn(d);render();});
});
document.addEventListener('click',()=>document.querySelectorAll('.ms-drop').forEach(x=>x.classList.remove('open')));
function updateMsBtn(d){
  const b=document.querySelector('#'+d.id+' .ms-btn'),a=S[d.sk];
  b.textContent=(!a.length?d.ph:a.length===1?a[0]:a.length+' selected')+' ▾';
  b.classList.toggle('active',a.length>0);
}
function populateSelects(){
  const fn=scopeFn(S.rg,S.sub);
  const base=ROWS.filter(fn);
  MS_DEFS.forEach(d=>{
    const vals=[...new Set(base.map(r=>r[d.sk]).filter(Boolean))].sort();
    const set=new Set(vals);
    S[d.sk]=S[d.sk].filter(v=>set.has(v));      // never keep a hidden filter
    const sel=new Set(S[d.sk]);
    const box=document.querySelector('#'+d.id+' .ms-opts');
    box.innerHTML='';
    vals.forEach(v=>{
      const l=document.createElement('label');l.className='ms-opt';l.dataset.val=v;
      const cb=document.createElement('input');cb.type='checkbox';cb.checked=sel.has(v);
      cb.addEventListener('change',()=>{const i=S[d.sk].indexOf(v);if(i>=0)S[d.sk].splice(i,1);else S[d.sk].push(v);updateMsBtn(d);render();});
      l.appendChild(cb);l.appendChild(document.createTextNode(' '+v));box.appendChild(l);
    });
    document.querySelector('#'+d.id+' .ms-search').value='';
    updateMsBtn(d);
  });
}

// ── chart ──────────────────────────────────────────────────────────────────
function monthly(y,typ,rg,sub){const fn=scopeFn(rg,sub);const m={};ROWS.forEach(r=>{if(r.y===y&&r.t===typ&&fn(r)&&applyFilters(r))m[r.m]=(m[r.m]||0)+r[S.measure];});return S.months.map(x=>m[x]||0);}
function trendSets(rg,sub,color){
  const ds=[{label:String(Y0),data:monthly(Y0,'R',rg,sub),color:'#90a4ae',w:1.5},
         {label:String(Y1),data:monthly(Y1,'R',rg,sub),color:'#42a5f5',w:2},
         {label:String(CY),data:monthly(CY,'R',rg,sub),color:color||'#1a237e',w:3}];
  if(bpOn(rg,sub))ds.push({label:'BP '+CY,data:monthly(CY,'B',rg,sub),color:'#e53935',w:2,dash:'5,3'});
  return ds;
}
function drawLineChart(el,datasets){
  const labels=S.months.map(m=>MONTHS_EN[m]);
  const vals=datasets.flatMap(d=>d.data).filter(v=>isFinite(v)&&v>0);
  if(!vals.length){el.innerHTML='<p style="color:#aaa;text-align:center;padding:50px 0">No data for the selected filters</p>';return;}
  const maxV=Math.max(...vals)*1.12;
  const W=760,H=220,PT=15,PR=20,PB=28,LH=28,PL=Math.max(70,fmtN(maxV).length*6+14),iW=W-PL-PR,iH=H-PT-PB;
  const xs=i=>PL+i*iW/Math.max(1,labels.length-1),ys=v=>PT+iH-Math.max(0,Math.min(1,v/maxV))*iH;
  let s=`<svg viewBox="0 0 ${W} ${H+LH}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">`;
  [0,.25,.5,.75,1].forEach(p=>{const v=maxV*p,y=ys(v);s+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="${p?'#efefef':'#ccc'}"/><text x="${PL-4}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#999">${fmtN(v)}</text>`;});
  labels.forEach((l,i)=>{s+=`<text x="${xs(i).toFixed(1)}" y="${PT+iH+14}" text-anchor="middle" font-size="10" fill="#999">${l}</text>`;});
  datasets.forEach(ds=>{const da=ds.dash?`stroke-dasharray="${ds.dash}"`:'';
    s+=`<polyline points="${ds.data.map((v,i)=>xs(i).toFixed(1)+','+ys(v||0).toFixed(1)).join(' ')}" fill="none" stroke="${ds.color}" stroke-width="${ds.w}" ${da} stroke-linejoin="round" stroke-linecap="round"/>`;
    ds.data.forEach((v,i)=>{s+=`<circle cx="${xs(i).toFixed(1)}" cy="${ys(v||0).toFixed(1)}" r="${ds.w>2?4:3}" fill="${ds.color}" stroke="#fff" stroke-width="1.5"><title>${ds.label} ${labels[i]}: ${fmtN(v)}</title></circle>`;});});
  let lx=PL;datasets.forEach(ds=>{const da=ds.dash?`stroke-dasharray="${ds.dash}"`:'';s+=`<line x1="${lx}" y1="${H+14}" x2="${lx+18}" y2="${H+14}" stroke="${ds.color}" stroke-width="2.5" ${da}/><text x="${lx+22}" y="${H+18}" font-size="10" fill="#666">${ds.label}</text>`;lx+=ds.label.length*6.8+34;});
  el.innerHTML=s+'</svg>';
}

// ── KPI models ─────────────────────────────────────────────────────────────
function kpi(label,rg,sub,maxM){
  const v1=sumM(pick(Y1,'R',rg,sub)),v2=sumM(pick(CY,'R',rg,sub));
  const bp=bpOn(rg,sub)?sumM(pick(CY,'B',rg,sub)):null;
  return{label,period:perLbl(maxM),v1,v2,bp,yoy:pct(v2,v1),vsbp:bp==null?null:pct(v2,bp)};
}
function kpiCard(k,color,onclick){
  const bpLine=k.bp==null?'<div class="sub" style="color:#9e9e9e">BP by manager only</div>'
    :`<div class="sub ${clsOf(k.vsbp)}">${k.bp?chgTxt(k.vsbp,' vs BP'):'No BP'}</div>`;
  return`<div class="kpi${onclick?' click':''}" style="border-top-color:${color}"${onclick?` onclick="${onclick}"`:''}>
    <div class="lbl" style="color:${color}">${k.label} ${k.period} ${CY} (${mLabel()})</div>
    <div class="val" style="color:${color}">${fmtN(k.v2)}</div>
    <div class="sub ${clsOf(k.yoy)}">${k.v1?chgTxt(k.yoy,' vs '+Y1):'No '+Y1}</div>${bpLine}</div>`;
}
function overviewKpis(){
  const list=RG_KEYS.map(rg=>({k:kpi(RGCFG[rg].flag+' '+RGCFG[rg].label,rg,'',RGCFG[rg].lastM),c:RGCFG[rg].color,rg}));
  list.push({k:kpi(GROUP_LABEL,null,'',0),c:'#37474f'});
  return list;
}
function regionKpis(){
  const rg=S.rg,cfg=RGCFG[rg];
  if(cfg.subs.length&&!S.sub){
    const list=cfg.subs.map(s=>({k:kpi(subLabel(rg,s.key),rg,s.key,cfg.lastM),c:s.color,sub:s.key}));
    list.push({k:kpi(cfg.flag+' '+cfg.label+' Total',rg,'',cfg.lastM),c:cfg.color});
    return list;
  }
  const lbl=S.sub?subLabel(rg,S.sub):cfg.flag+' '+cfg.label;
  const color=S.sub?subCfg(rg,S.sub).color:cfg.color;
  return[{k:kpi(lbl,rg,S.sub,cfg.lastM),c:color}];
}
function bpInfo(rg,sub){
  return bpOn(rg,sub)?'':'<div class="info">The Business Plan of UK SALES is set per manager, not per branch (UK · Malta · Spain), so this view shows sales only. Compare against BP in the manager tabs or in the UK SALES total. Malta only starts billing in 2026, partly taking over sales previously billed by the UK branch, so year-on-year by branch is not like-for-like.</div>';
}

const TAB={c2:{f:'c2',label:'Customer General',bp:false,top:50},cbp:{f:'cbp',label:'Customer w/ BP',bp:true,top:0},ch:{f:'ch',label:'Channel',bp:true,top:0},
  br:{f:'br',label:'Brand',bp:true,top:0},fp:{f:'fp',label:'Family',bp:true,top:0},cat:{f:'cat',label:'Category',bp:false,top:0},sku:{f:'sku',label:'SKU',bp:false,top:0}};

function overviewTables(){
  return[{title:`Top 50 Customer General (${mLabel()})`,sheet:'Top 50 Customers',model:dimModel('c2','Customer General',null,'',false,50)},
         {title:`Top 50 SKU – All Brands (${mLabel()})`,sheet:'Top 50 SKUs',model:dimModel('sku','SKU',null,'',false,50)},

function renderOverview(){
  const ks=overviewKpis();

function renderRegion(){
  const rg=S.rg,cfg=RGCFG[rg],tc=TAB[S.st];
  const ks=regionKpis();
  const kh='<div class="kpi-row">'+ks.map(x=>kpiCard(x.k,x.c,x.sub?`selectSub('${x.sub}')`:'')).join('')+'</div>';
  const who=S.sub?subLabel(rg,S.sub):cfg.flag+' '+cfg.label;
  const color=S.sub?subCfg(rg,S.sub).color:cfg.color;
  const model=dimModel(tc.f,tc.label,rg,S.sub,tc.bp,tc.top);
  document.getElementById('content').innerHTML=bpInfo(rg,S.sub)+kh+
    `<div class="chart-box"><h3>${who} Monthly Trend ${perLbl(cfg.lastM)} – ${mLabel()}</h3><div id="chartWrap"></div></div>`+
    tableHtml(`${who} – ${tc.label} (${mLabel()})${tc.top?' – Top '+tc.top:''}`,model,cfg.color);
  drawLineChart(document.getElementById('chartWrap'),trendSets(rg,S.sub,color));
}
function render(){if(!S.rg)renderOverview();else renderRegion();}

function buildStabs2(){
  const el=document.getElementById('stabs2');S.sub='';
  const subs=S.rg?RGCFG[S.rg].subs:[];
  if(!subs.length){el.innerHTML='';el.classList.remove('vis');return;}

function selectSub(k){S.sub=k;document.querySelectorAll('#stabs2 .stab2').forEach(t=>t.classList.toggle('on',t.dataset.sub===k));populateSelects();render();}

// ── Excel export ───────────────────────────────────────────────────────────
function exportXlsx(){
  if(typeof XLSX==='undefined'){alert('The Excel library could not be loaded (no internet connection?).');return;}
  const wb=XLSX.utils.book_new(),used=new Set();
  const add=(name,aoa,types)=>{
    let n=name.replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,31),i=2;while(used.has(n)){n=name.slice(0,28)+' '+i++;}used.add(n);
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    if(types){const rng=XLSX.utils.decode_range(ws['!ref']);
      for(let R=1;R<=rng.e.r;R++)for(let C=0;C<=rng.e.c;C++){const cell=ws[XLSX.utils.encode_cell({r:R,c:C})];if(cell&&cell.t==='n')cell.z=types[C]==='pct'?'0.0%':'#,##0';}}
    ws['!cols']=aoa[0].map((_,c)=>({wch:c===0?40:14}));
    XLSX.utils.book_append_sheet(wb,ws,n);
  };
  const clean=v=>typeof v!=='number'?v:!isFinite(v)?null:Math.round(v*1e4)/1e4;
  const where=S.rg?(S.sub?RGCFG[S.rg].label+' – '+subCfg(S.rg,S.sub).label:RGCFG[S.rg].label):'Overview';
  add('Filters',[['Item','Value'],['View',where],['Months',perLbl()+' '+CY],['Measure',mLabel()],
    ['Customers',S.c2.join(', ')||'All'],['Channels',S.ch.join(', ')||'All'],['Brands',S.br.join(', ')||'All'],
    ['Families',S.fp.join(', ')||'All'],['Categories',S.cat.join(', ')||'All'],['SKUs',S.sku.join(', ')||'All'],
    ['Note',document.querySelector('#hdr .note').textContent],['Exported',new Date().toLocaleString('en-GB')]]);
  const ks=S.rg?regionKpis():overviewKpis();
  add('KPIs',[['Scope','Period',String(Y1),String(CY),'% YoY','BP '+CY,'% vs BP']].concat(ks.map(x=>[x.k.label,x.k.period,x.k.v1,x.k.v2,clean(x.k.yoy),x.k.bp,clean(x.k.vsbp)])),
    ['txt','txt','num','num','pct','num','pct']);
  const ds=trendSets(S.rg||null,S.sub);
  add('Monthly trend',[['Month'].concat(ds.map(d=>d.label))].concat(S.months.map((m,i)=>[MONTHS_EN[m]].concat(ds.map(d=>d.data[i])))),['txt','num','num','num','num']);
  const tables=S.rg?Object.values(TAB).map(tc=>({sheet:tc.label,model:dimModel(tc.f,tc.label,S.rg,S.sub,tc.bp,tc.top)})):overviewTables();
  tables.forEach(t=>{const types=t.model.cols.map(c=>c.type);
    add(t.sheet,[t.model.cols.map(c=>c.h)].concat(t.model.body.map(r=>r.map(clean)),[t.model.foot.map(clean)]),types);});
  const fname=`${GROUP_LABEL.replace(/^\W+/,'')} ${where} ${perLbl()} ${CY} ${mLabel()}.xlsx`.replace(/[\\\/:*?"<>|+]/g,'-');
  XLSX.writeFile(wb,fname);
}

document.querySelectorAll('.mpill').forEach(el=>el.addEventListener('click',()=>{
  el.classList.toggle('on');const m=+el.dataset.m;
  if(el.classList.contains('on'))S.months.push(m);else S.months=S.months.filter(x=>x!==m);
  if(!S.months.length){el.classList.add('on');S.months=[m];}
  S.months.sort((a,b)=>a-b);render();
}));
document.querySelectorAll('.mtog button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.mtog button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.measure=b.dataset.ms;render();
}));
document.querySelectorAll('.mtab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.mtab').forEach(x=>x.classList.remove('on'));t.classList.add('on');S.rg=t.dataset.rg;
  document.getElementById('stabs').classList.toggle('vis',!!S.rg);
  buildStabs2();populateSelects();render();window.scrollTo(0,0);
}));
document.querySelectorAll('.stab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.stab').forEach(x=>x.classList.remove('on'));t.classList.add('on');S.st=t.dataset.st;render();
}));
document.getElementById('btnXls').addEventListener('click',exportXlsx);
populateSelects();render();
</script>
</body>
</html>
