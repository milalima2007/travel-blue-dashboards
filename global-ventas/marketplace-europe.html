<meta charset="utf-8">
<title>Marketplace Sales Europe 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0a0e1a; --card:#111827; --card2:#0f172a; --border:#1e293b;
  --text:#e2e8f0; --dim:#64748b; --label:#475569;
  --accent:#3b82f6; --accent2:rgba(59,130,246,.15); --accent-glow:rgba(59,130,246,.2);
  --pill-on:#3b82f6; --pill-on-t:#fff;
  --pill-off:#1e293b; --pill-off-t:#64748b;
  --tab-on:#e2e8f0; --tab-off:#475569;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
  padding-inline:16px;padding-block:0 56px;min-height:100vh}
.wrap{max-width:1600px;margin:0 auto}

/* Header */
.hdr{background:linear-gradient(135deg,#111827 0%,#1e293b 100%);border-bottom:2px solid var(--accent);
  margin-inline:-16px;padding:16px 28px;display:flex;align-items:center;
  justify-content:space-between;flex-wrap:wrap;gap:12px}
.hdr-title{font-size:18px;font-weight:700;letter-spacing:-.02em;color:#fff}
.hdr-sub{font-size:12px;color:var(--dim);margin-top:3px}
.measure-tog{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.mtog{padding:6px 16px;font-size:12px;font-weight:600;cursor:pointer;border:none;
  background:var(--pill-off);color:var(--pill-off-t);transition:.15s;font-family:inherit}
.mtog.on{background:var(--accent);color:#fff}

/* Month pills */
.month-row{padding-block:14px 0;display:flex;flex-wrap:wrap;gap:5px}
.mpill{padding:4px 12px;border-radius:16px;font-size:11.5px;font-weight:500;cursor:pointer;
  background:var(--pill-on);color:var(--pill-on-t);border:none;transition:.15s;font-family:inherit}
.mpill.off{background:var(--pill-off);color:var(--pill-off-t)}

/* Filter bar */
.fbar{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fbar-lbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--dim)}
.ms-wrap{position:relative}
.ms-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;
  background:var(--card);border:1px solid var(--border);border-radius:7px;
  color:var(--dim);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;
  white-space:nowrap;transition:.15s;min-width:110px;justify-content:space-between}
.ms-btn:hover{border-color:var(--dim)}
.ms-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent2)}
.ms-btn svg{flex-shrink:0;opacity:.6}
.ms-panel{display:none;position:absolute;top:calc(100% + 5px);left:0;min-width:200px;
  background:#111827;border:1px solid var(--border);border-radius:9px;z-index:999;
  box-shadow:0 12px 40px rgba(0,0,0,.7);padding:8px;max-height:280px;overflow:hidden;flex-direction:column}
.ms-panel.open{display:flex}
.ms-search{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:5px;
  color:var(--text);font-size:11.5px;padding:5px 9px;margin-bottom:6px;outline:none;font-family:inherit}
.ms-search:focus{border-color:var(--accent)}
.ms-search::placeholder{color:var(--label)}
.ms-opts{overflow-y:auto;flex:1}
.ms-opts::-webkit-scrollbar{width:4px}
.ms-opts::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.ms-opt{display:flex;align-items:center;gap:7px;padding:5px 6px;cursor:pointer;
  border-radius:5px;font-size:12px;color:var(--text);user-select:none}
.ms-opt:hover{background:var(--card2)}
.ms-opt input{accent-color:var(--accent);cursor:pointer;width:13px;height:13px;flex-shrink:0}
.ms-all{display:flex;align-items:center;justify-content:space-between;padding:5px 6px 8px;
  border-bottom:1px solid var(--border);margin-bottom:5px}
.ms-all-btn{background:none;border:none;color:var(--accent);font-size:11px;font-weight:600;
  font-family:inherit;cursor:pointer;padding:2px 6px;border-radius:4px;transition:.12s}
.ms-all-btn:hover{background:var(--accent2)}
.fbar-reset{padding:5px 12px;border-radius:7px;background:var(--card);border:1px solid var(--border);
  color:var(--dim);font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.fbar-reset:hover{border-color:var(--accent);color:var(--accent)}

/* KPIs */
.kpi-row{margin-top:14px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.kpi-row{grid-template-columns:1fr 1fr}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent);opacity:.6}
.kpi-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:7px}
.kpi-value{font-size:26px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;color:#fff}
.kpi-sub{font-size:11.5px;color:var(--dim);margin-top:5px}

/* Customer tabs */
.cust-tabs{margin-top:20px;display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.ctab{padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;color:var(--tab-off);
  border:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
  transition:.15s;font-family:inherit;background:none}
.ctab.on{color:var(--tab-on);border-bottom-color:var(--accent)}
.ctab:hover{color:var(--text)}

/* Country zone */
.ctry-row{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctry-lbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-right:4px}
.cpill{padding:5px 12px;border-radius:16px;font-size:11.5px;font-weight:500;cursor:pointer;
  border:1px solid var(--border);background:var(--card);color:var(--dim);transition:.15s;font-family:inherit}
.cpill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cpill:hover{border-color:var(--dim)}
.country-info{margin-top:12px;display:flex;align-items:center;gap:8px}
.cbadge{background:var(--accent2);color:var(--accent);padding:4px 12px;border-radius:7px;
  font-size:12.5px;font-weight:600;border:1px solid rgba(59,130,246,.3)}
.country-note{font-size:12px;color:var(--dim)}

/* Chart */
.chart-sec{margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.chart-head{padding:13px 18px 0;display:flex;align-items:center;justify-content:space-between}
.chart-ttl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.chart-body{padding:14px 18px 12px}
canvas{width:100%;display:block}

/* 3-col grid */
.grid3{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.grid3{grid-template-columns:1fr}}
.sec{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.sec-full{margin-top:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.sec-head{padding:11px 14px 10px;border-bottom:1px solid var(--border);font-size:10px;
  font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{padding:6px 11px;text-align:right;font-size:9.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;color:var(--label);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--card2)}
.tbl th:first-child{text-align:left}
.tbl td{padding:7px 11px;border-bottom:1px solid var(--border);text-align:right;
  font-variant-numeric:tabular-nums;color:#cbd5e1;white-space:nowrap}
.tbl td:first-child{text-align:left;font-weight:600;color:#f1f5f9;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--card2)}
.tbl .tot td{font-weight:700;background:var(--card2);border-top:1px solid var(--border);border-bottom:none;color:#f8fafc}
.bar-cell{display:flex;align-items:center;gap:5px;justify-content:flex-end}
.bar{height:4px;border-radius:2px;background:var(--accent);opacity:.55;flex-shrink:0}
.tw{overflow-x:auto}
.tw::-webkit-scrollbar{width:4px;height:4px}
.tw::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sku-search{padding:9px 14px 8px;border-bottom:1px solid var(--border)}
.sku-search input{width:100%;padding:7px 11px;font-size:12px;font-family:inherit;
  border:1px solid var(--border);border-radius:7px;background:var(--card2);color:var(--text);outline:none}
.sku-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.sku-search input::placeholder{color:var(--label)}
.tw-sku{overflow-x:auto;max-height:340px;overflow-y:auto}
.tw-sku::-webkit-scrollbar{width:4px;height:4px}
.tw-sku::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Active filters badge */
.f-badge{display:inline-block;background:var(--accent);color:#fff;border-radius:10px;
  font-size:10px;font-weight:700;padding:1px 6px;margin-left:4px}
</style>

  <div>
    <div class="hdr-title">🌍 Marketplace Sales Europe · 2026</div>

</div>

/* ── Multi-select dropdown ── */
function unique(field){
  return [...new Set(RAW.filter(r=>r.cust===S.cust).map(r=>r[field]))].sort();
}

function buildDropdown(wrId, field, label, getter, setter){
  const wrap = document.getElementById(wrId);
  const sel = getter();
  const opts = unique(field);
  const hasActive = sel.length > 0;
  wrap.innerHTML = `
    <button class="ms-btn${hasActive?' active':''}" id="btn-${field}">
      ${label}${hasActive?`<span class="f-badge">${sel.length}</span>`:''}
      <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
    </button>
    <div class="ms-panel" id="panel-${field}">
      <input class="ms-search" placeholder="Search ${label.toLowerCase()}..." id="srch-${field}">
      <div class="ms-all">
        <span style="font-size:11px;color:var(--dim)">${opts.length} items</span>
        <button class="ms-all-btn" id="all-${field}">${sel.length===opts.length?'Clear all':'Select all'}</button>
      </div>
      <div class="ms-opts" id="opts-${field}"></div>
    </div>`;

  function renderOpts(q=''){
    const cur=getter();
    const el=document.getElementById('opts-'+field);
    el.innerHTML=opts.filter(o=>!q||o.toLowerCase().includes(q.toLowerCase())).map(o=>`
      <label class="ms-opt">
        <input type="checkbox" value="${o}" ${cur.includes(o)?'checked':''}>
        ${o}
      </label>`).join('');
    el.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',e=>{
      e.stopPropagation();
      const c=getter().slice();
      const v=cb.value;
      if(cb.checked){if(!c.includes(v))c.push(v);}else{const i=c.indexOf(v);if(i>=0)c.splice(i,1);}
      setter(c);
      renderMonths(); renderTabs(); renderCtry(); buildAllDropdowns(field); renderAll();
    }));
  }
  renderOpts();

  document.getElementById('srch-'+field).addEventListener('input',e=>{e.stopPropagation();renderOpts(e.target.value);});
  document.getElementById('srch-'+field).addEventListener('click',e=>e.stopPropagation());

  const allBtn=document.getElementById('all-'+field);
  if(allBtn) allBtn.addEventListener('click',e=>{
    e.stopPropagation();
    const cur=getter();
    setter(cur.length===opts.length?[]:[...opts]);
    renderMonths(); renderTabs(); renderCtry(); buildAllDropdowns(field); renderAll();
  });

  const btn=document.getElementById('btn-'+field);
  const panel=document.getElementById('panel-'+field);
  panel.addEventListener('click',e=>e.stopPropagation());
  btn.addEventListener('click',e=>{e.stopPropagation();
    document.querySelectorAll('.ms-panel.open').forEach(p=>{if(p!==panel)p.classList.remove('open');});
    panel.classList.toggle('open');
  });
}

function buildAllDropdowns(keepOpen=null){
  buildDropdown('wrap-br','br','Brand',()=>S.br,v=>{S.br=v});
  buildDropdown('wrap-fam','fam','Family',()=>S.fam,v=>{S.fam=v});
  buildDropdown('wrap-cat','cat','Category',()=>S.cat,v=>{S.cat=v});
  buildDropdown('wrap-sku','sku','SKU',()=>S.sku,v=>{S.sku=v});
  if(keepOpen){const p=document.getElementById('panel-'+keepOpen);if(p)p.classList.add('open');}
}

document.addEventListener('click',()=>document.querySelectorAll('.ms-panel.open').forEach(p=>p.classList.remove('open')));

/* ── Chart ── */
function niceMax(v){ const m=Math.pow(10,Math.floor(Math.log10(Math.max(v,1)))); return Math.ceil(v*1.15/m)*m; }

function drawChart(rows){
  const cv=document.getElementById('chart');
  const dpr=window.devicePixelRatio||1;
  const W=cv.parentElement.clientWidth-36;
  const H=220;
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);

  const LINE='#3b82f6', FILL='rgba(59,130,246,0.09)', GRID='#1e293b', TXT='#475569';

  const byM={};
  S.months.forEach(m=>byM[m]=0);
  rows.forEach(r=>{byM[r.m]=(byM[r.m]||0)+val(r);});
  const pts=S.months.map(m=>byM[m]||0);
  const maxV=niceMax(Math.max(...pts,1));

  const PAD={l:100,r:20,t:22,b:38};
  const w=W-PAD.l-PAD.r, h=H-PAD.t-PAD.b;
  const n=pts.length;
  const xs=i=>PAD.l+(n>1?i*w/(n-1):w/2);
  const ys=v=>PAD.t+h-(v/maxV)*h;

  // grid lines + y labels (always full integer)
  const ticks=4;
  ctx.font='11px Inter,sans-serif'; ctx.textAlign='right';
  for(let i=0;i<=ticks;i++){
    const yv=(maxV/ticks)*i; const y=ys(yv);
    ctx.strokeStyle=GRID; ctx.lineWidth=1; ctx.setLineDash([3,5]);
    ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(W-PAD.r,y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=TXT;
    ctx.fillText((S.measure==='eur'?'€':'')+Math.round(yv).toLocaleString('en-GB'), PAD.l-8, y+4);
  }

  // area
  ctx.beginPath();
  ctx.moveTo(xs(0),ys(pts[0]));
  pts.forEach((v,i)=>{if(i>0)ctx.lineTo(xs(i),ys(v));});
  ctx.lineTo(xs(n-1),H-PAD.b); ctx.lineTo(xs(0),H-PAD.b); ctx.closePath();
  ctx.fillStyle=FILL; ctx.fill();

  // line
  ctx.beginPath(); ctx.moveTo(xs(0),ys(pts[0]));
  pts.forEach((v,i)=>{if(i>0)ctx.lineTo(xs(i),ys(v));});
  ctx.strokeStyle=LINE; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.setLineDash([]); ctx.stroke();

  // month labels
  ctx.font='11px Inter,sans-serif'; ctx.textAlign='center'; ctx.fillStyle=TXT;
  pts.forEach((_,i)=>ctx.fillText(MN[S.months[i]-1],xs(i),H-PAD.b+20));

  // dots + value labels
  pts.forEach((v,i)=>{
    const x=xs(i),y=ys(v);
    ctx.beginPath(); ctx.arc(x,y,4.5,0,Math.PI*2);
    ctx.fillStyle='#0a0e1a'; ctx.fill();
    ctx.strokeStyle=LINE; ctx.lineWidth=2.5; ctx.stroke();
    if(v>0){
      ctx.font='600 11px Inter,sans-serif'; ctx.fillStyle='#93c5fd'; ctx.textAlign='center';
      ctx.fillText((S.measure==='eur'?'€':'')+Math.round(v).toLocaleString('en-GB'), x, y-12);
    }
  });
}

/* ── Analysis tables ── */
function mkTable(rows,field,lbl){
  const m={};
  rows.forEach(r=>{m[r[field]]=(m[r[field]]||0)+val(r);});
  const tot=Object.values(m).reduce((a,b)=>a+b,0);
  const ents=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  let h=`<table class="tbl"><thead><tr><th>${lbl}</th><th>${colHead()}</th><th>Share</th></tr></thead><tbody>`;
  ents.forEach(([k,v])=>{
    const sh=tot?v/tot:0;
    h+=`<tr><td>${k}</td><td>${fmtV(v)}</td><td><div class="bar-cell"><span class="bar" style="width:${Math.round(sh*54)}px"></span>${(sh*100).toFixed(1)}%</div></td></tr>`;
  });
  h+=`<tr class="tot"><td>Total</td><td>${fmtV(tot)}</td><td></td></tr></tbody></table>`;
  return h;
}

function mkSKU(rows){
  const m={};
  rows.forEach(r=>{
    if(!m[r.sku])m[r.sku]={sku:r.sku,desc:r.desc,fam:r.fam,eur:0,qty:0};
    m[r.sku].eur+=r.eur; m[r.sku].qty+=r.qty;
  });
  const ents=Object.values(m).sort((a,b)=>b[S.measure]-a[S.measure]);
  const tot=ents.reduce((a,e)=>a+e[S.measure],0);
  const trs=ents.map(e=>{
    const v=e[S.measure],sh=tot?v/tot:0;
    const avg=e.qty>0?(e.eur/e.qty).toFixed(2):'—';
    return `<tr><td>${e.sku}</td><td style="color:#94a3b8;font-size:12px">${e.desc}</td><td style="color:#94a3b8">${e.fam}</td><td>${fmtFull(e.eur)}</td><td>${Math.round(e.qty).toLocaleString('en-GB')}</td><td>€${avg!=='—'?parseFloat(avg).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}):avg}</td><td><div class="bar-cell"><span class="bar" style="width:${Math.round(sh*50)}px"></span>${(sh*100).toFixed(1)}%</div></td></tr>`;
  }).join('');
  return `<table class="tbl" id="sku-tbl">
    <thead><tr><th>SKU</th><th>Description</th><th>Family</th><th>€ Revenue</th><th>Qty</th><th>Avg Price</th><th>Share</th></tr></thead>
    <tbody id="sku-tbody">${trs}</tbody></table>`;
}

/* ── Render blocks ── */
function renderMonths(){
  document.getElementById('month-row').innerHTML=MN.map((n,i)=>{
    const m=i+1,on=S.months.includes(m);
    return `<button class="mpill${on?'':' off'}" data-m="${m}">${n}</button>`;
  }).join('');
  document.querySelectorAll('.mpill').forEach(b=>b.addEventListener('click',()=>{
    const m=+b.dataset.m;
    S.months=S.months.includes(m)?(S.months.length>1?S.months.filter(x=>x!==m):S.months):[...S.months,m].sort((a,b)=>a-b);
    renderMonths(); renderAll();
  }));
}

function renderTabs(){
  document.getElementById('cust-tabs').innerHTML=CUSTS.map(c=>
    `<button class="ctab${S.cust===c?' on':''}" data-c="${c}">${CFLAGS[c]} ${c}</button>`
  ).join('');
  document.querySelectorAll('.ctab').forEach(t=>t.addEventListener('click',()=>{
    S.cust=t.dataset.c; S.ctry='ALL';
    S.br=[]; S.fam=[]; S.cat=[]; S.sku=[];
    renderTabs(); renderCtry(); buildAllDropdowns(); renderAll();
  }));
}

function renderCtry(){
  const el=document.getElementById('ctry-zone');
  if(S.cust==='Amazon EU'){
    const tots={};
    RAW.filter(r=>r.cust==='Amazon EU'&&S.months.includes(r.m)).forEach(r=>{tots[r.ctry]=(tots[r.ctry]||0)+r.eur;});
    el.innerHTML='<div class="ctry-row"><span class="ctry-lbl">Country:</span>'+
      EU_CTRY.map(c=>{
        const lbl=c==='ALL'?'All Countries':(CFLG[c]||'')+' '+c;
        const v=c==='ALL'?Object.values(tots).reduce((a,b)=>a+b,0):(tots[c]||0);
        const sub=c==='ALL'?'':' ('+fmtFull(v)+')';
        return `<button class="cpill${S.ctry===c?' on':''}" data-c="${c}">${lbl}${sub}</button>`;
      }).join('')+'</div>';
    document.querySelectorAll('.cpill').forEach(b=>b.addEventListener('click',()=>{S.ctry=b.dataset.c;renderCtry();renderAll();}));
  } else {
    const s=SINGLE[S.cust];
    el.innerHTML=`<div class="country-info">${CFLG[s]||''} <span class="cbadge">${s}</span><span class="country-note">All sales in this country</span></div>`;
  }
}

function renderAll(){
  const rows=filtered();
  const totEur=rows.reduce((a,r)=>a+r.eur,0);
  const totQty=rows.reduce((a,r)=>a+r.qty,0);
  const skus=new Set(rows.map(r=>r.sku)).size;
  const mn=S.months[0],mx=S.months[S.months.length-1];
  document.getElementById('hdr-sub').textContent=(mn===mx?MN[mn-1]:MN[mn-1]+'–'+MN[mx-1])+' 2026';
  const brands=new Set(rows.map(r=>r.br)).size;
  const cats=new Set(rows.map(r=>r.cat)).size;
  const avgOrder=totQty>0?totEur/totQty:0;
  document.getElementById('kpi-row').innerHTML=`
    <div class="kpi"><div class="kpi-label">Revenue (EUR)</div><div class="kpi-value">${fmtFull(totEur)}</div><div class="kpi-sub">${S.months.length} month${S.months.length>1?'s':''}</div></div>
    <div class="kpi"><div class="kpi-label">Total Units</div><div class="kpi-value">${Math.round(totQty).toLocaleString('en-GB')}</div><div class="kpi-sub">units sold</div></div>
    <div class="kpi"><div class="kpi-label">Active SKUs</div><div class="kpi-value">${skus}</div><div class="kpi-sub">products</div></div>
    <div class="kpi"><div class="kpi-label">Brands</div><div class="kpi-value">${brands}</div><div class="kpi-sub">active brands</div></div>
    <div class="kpi"><div class="kpi-label">Categories</div><div class="kpi-value">${cats}</div><div class="kpi-sub">active</div></div>
    <div class="kpi"><div class="kpi-label">Avg € / Unit</div><div class="kpi-value">${fmtFull(avgOrder)}</div><div class="kpi-sub">avg selling price</div></div>
  `;
  document.getElementById('chart-ttl').textContent='Monthly Trend · '+(S.measure==='eur'?'€ Revenue':'Units');
  drawChart(rows);
  document.getElementById('grid3').innerHTML=`
    <div class="sec"><div class="sec-head">By Brand</div><div class="tw">${mkTable(rows,'br','Brand')}</div></div>
    <div class="sec"><div class="sec-head">By Family</div><div class="tw">${mkTable(rows,'fam','Family')}</div></div>
    <div class="sec"><div class="sec-head">By Category</div><div class="tw">${mkTable(rows,'cat','Category')}</div></div>
  `;
  document.getElementById('sku-sec').innerHTML=`
    <div class="sec-head">By SKU</div>
    <div class="sku-search"><input type="text" id="sku-filter" placeholder="Search SKU or description…"></div>
    <div class="tw-sku">${mkSKU(rows)}</div>
  `;
  document.getElementById('sku-filter').addEventListener('input',e=>{
    const q=e.target.value.toLowerCase();
    document.querySelectorAll('#sku-tbody tr').forEach(tr=>{tr.hidden=q&&!tr.textContent.toLowerCase().includes(q);});
  });
}

document.querySelectorAll('.mtog').forEach(b=>b.addEventListener('click',()=>{
  S.measure=b.dataset.m;
  document.querySelectorAll('.mtog').forEach(x=>x.classList.toggle('on',x===b));
  renderAll();
}));

window.addEventListener('resize',()=>drawChart(filtered()));

renderMonths(); renderTabs(); renderCtry(); buildAllDropdowns(); renderAll();
</script>
