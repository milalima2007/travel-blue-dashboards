.rng select:focus{border-color:var(--accent)}

.xbtn:hover{filter:brightness(1.12)}
.kpi-strip{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.kpi{flex:1;padding:8px 14px;border-right:1px solid var(--border)}
.kpi:last-child{border-right:none}
.kpi-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.kpi-val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi-sub{font-size:11px;color:var(--text2)}

.wh-tab{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid transparent;letter-spacing:.03em}
.tbl-outer{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{position:sticky;top:0;z-index:10}

td{padding:5px 9px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

.tt{font-weight:700;color:var(--accent)}

const WH=['BONDED','DACHSER','DUBAI','PACWOLF','SPAIN','MIAMI','MONTEVIDEO'];
const WHC={BONDED:'#1D6FE8',DACHSER:'#0E9E91',DUBAI:'#C98A00',PACWOLF:'#7C3AED',SPAIN:'#D62929',MIAMI:'#E05C1A',MONTEVIDEO:'#1B9A5E'};
const MNAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul'];
let curWH='BONDED', m1=1, m2=7;
let ss={avg:{c:9,d:-1},mon:{c:9,d:-1}}, ft={avg:'',mon:''};

const months=()=>{const a=[];for(let m=m1;m<=m2;m++)a.push(String(m));return a;};
const nm=()=>m2-m1+1;
function fmt(n){if(!n)return '0';return Math.round(n).toLocaleString('en-US');}

// average over the selected month range
function avgRow(r){
  const ms=months();
  const vs=WH.map(w=>{let s=0;const d=r.monthly[w]||{};ms.forEach(m=>s+=(d[m]||0));return s/nm();});
  return {code:r.code,name:r.name,vals:[...vs,vs.reduce((a,b)=>a+b,0)]};
}
// per-month totals for one warehouse
function monRow(r,wh){
  const d=r.monthly[wh]||{};
  const vs=months().map(m=>d[m]||0);
  return {code:r.code,name:r.name,vals:[...vs,vs.reduce((a,b)=>a+b,0)]};
}
let avgRows=[], monRows=[];
function rebuild(){avgRows=DATA.map(avgRow);monRows=DATA.map(r=>monRow(r,curWH));}

function renderTbl(id,rows){
  const q=ft[id].toLowerCase();
  let fil=q?rows.filter(r=>r.code.toLowerCase().includes(q)||(r.name||'').toLowerCase().includes(q)):rows;
  const {c,d}=ss[id];
  const last=fil[0]?fil[0].vals.length-1:0;
  const ci=Math.min(c-2,last);
  if(c===0)fil=[...fil].sort((a,b)=>d*a.code.localeCompare(b.code));
  else if(c===1)fil=[...fil].sort((a,b)=>d*(a.name||'').localeCompare(b.name||''));
  else fil=[...fil].sort((a,b)=>d*((a.vals[ci]||0)-(b.vals[ci]||0)));
  document.getElementById(id==='avg'?'c1':'c2').textContent=fil.length+' items';
  const frag=document.createDocumentFragment();
  fil.forEach(r=>{
    const tr=document.createElement('tr');
    const L=r.vals.length-1;
    let h='<td>'+r.code+'</td><td>'+(r.name||'')+'</td>';
    r.vals.forEach((v,i)=>{h+='<td class="'+(i===L?'tt':'')+'">'+fmt(v)+'</td>';});
    tr.innerHTML=h;frag.appendChild(tr);
  });
  const tb=document.getElementById('tb-'+id);tb.innerHTML='';tb.appendChild(frag);
  updKPI(id,fil);
  window['last_'+id]=fil;
}
function updKPI(id,fil){
  const el=document.getElementById(id==='avg'?'kpi1':'kpi2');
  if(!fil.length){el.innerHTML='';return;}
  const L=fil[0].vals.length-1;
  const gt=fil.reduce((s,r)=>s+(r.vals[L]||0),0);
  const nz=fil.filter(r=>r.vals[L]>0).length;
  const top=[...fil].sort((a,b)=>b.vals[L]-a.vals[L])[0];
  const lbl=id==='avg'?('Monthly Avg Total ('+nm()+' mo)'):('Period Total \u2014 '+curWH);
  el.innerHTML='<div class="kpi"><div class="kpi-lbl">'+lbl+'</div><div class="kpi-val">'+Math.round(gt).toLocaleString('en-US')+'</div><div class="kpi-sub">'+fil.length+' SKUs shown</div></div>'+
   '<div class="kpi"><div class="kpi-lbl">Active SKUs</div><div class="kpi-val">'+nz+'</div><div class="kpi-sub">with qty &gt; 0</div></div>'+
   '<div class="kpi"><div class="kpi-lbl">Top Product</div><div class="kpi-val" style="font-size:14px">'+(top?top.code:'-')+'</div><div class="kpi-sub">'+(top?Math.round(top.vals[L]).toLocaleString('en-US')+' units':'')+'</div></div>';
}
function filter(id,v){ft[id]=v;renderTbl(id,id==='avg'?avgRows:monRows);}
function sortTbl(id,col){
  const s=ss[id];s.d=(s.c===col)?-s.d:-1;s.c=col;
  const t=document.getElementById('tbl-'+id);
  t.querySelectorAll('th').forEach((th,i)=>{th.classList.remove('sd','sa');if(i===col)th.classList.add(s.d===-1?'sd':'sa');});
  renderTbl(id,id==='avg'?avgRows:monRows);
}
function buildWHTabs(){
  const el=document.getElementById('whTabs');el.innerHTML='';
  WH.forEach(wh=>{
    const b=document.createElement('button');
    b.className='wh-tab'+(wh===curWH?' active':'');b.textContent=wh;
    b.style.color=wh===curWH?'#fff':WHC[wh];
    b.style.borderColor=WHC[wh]+'55';
    if(wh===curWH)b.style.background=WHC[wh];
    b.onclick=()=>{curWH=wh;monRows=DATA.map(r=>monRow(r,wh));buildWHTabs();renderTbl('mon',monRows);};
    el.appendChild(b);
  });
}
// month-range header rebuild
function monHead(){
  const t=document.getElementById('tbl-mon').querySelector('thead tr');
  let h='<th onclick="sortTbl(\'mon\',0)">Code</th><th onclick="sortTbl(\'mon\',1)">Name</th>';
  months().forEach((m,i)=>{h+='<th onclick="sortTbl(\'mon\','+(i+2)+')">'+MNAMES[+m-1]+'</th>';});
  h+='<th onclick="sortTbl(\'mon\','+(months().length+2)+')">Total</th>';
  t.innerHTML=h;
  ss.mon.c=months().length+2;ss.mon.d=-1;
  t.querySelectorAll('th')[ss.mon.c].classList.add('sd');
}

  ss.avg.c=9;ss.avg.d=-1;
  const ta=document.getElementById('tbl-avg');
  ta.querySelectorAll('th').forEach((th,i)=>{th.classList.remove('sd','sa');if(i===9)th.classList.add('sd');});
  renderTbl('avg',avgRows);renderTbl('mon',monRows);
}
// ---- export to Excel (CSV, opens natively in Excel) ----
function expo(which){
  const rows=window['last_'+which]||[];
  let head,name;
  if(which==='avg'){
    head=['CODE','NAME',...WH,'TOTAL'];
    name='TB_Consumption_MonthlyAvg_'+MNAMES[m1-1]+'-'+MNAMES[m2-1]+'_2026.csv';
  }else{
    head=['CODE','NAME',...months().map(m=>MNAMES[+m-1]),'TOTAL'];
    name='TB_Consumption_'+curWH+'_'+MNAMES[m1-1]+'-'+MNAMES[m2-1]+'_2026.csv';
  }
  const esc=v=>{const s=String(v==null?'':v);return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const lines=[head.join(';')];
  rows.forEach(r=>lines.push([esc(r.code),esc(r.name),...r.vals.map(v=>Math.round(v))].join(';')));
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}
