<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;font-size:13px}
/* ── header ── */
#hdr{background:#0d47a1;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.3)}

.mpill{padding:4px 10px;border-radius:12px;border:1px solid #90caf9;background:#e3f2fd;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.mpill.on{background:#0d47a1;color:#fff;border-color:#0d47a1}
.fsel{padding:4px 8px;border:1px solid #ccc;border-radius:6px;font-size:12px;background:#fafafa;cursor:pointer;min-width:110px}
.fsep{width:1px;height:22px;background:#ddd;margin:0 4px}
.mtog{display:flex;gap:0;border:1px solid #90caf9;border-radius:8px;overflow:hidden}
.mtog button{padding:4px 10px;border:none;background:#e3f2fd;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.mtog button.on{background:#0d47a1;color:#fff}
/* ── tabs ── */
#tabs{background:#fff;border-bottom:2px solid #e0e0e0;display:flex;overflow-x:auto;padding:0 20px}
.tab{padding:10px 16px;cursor:pointer;font-size:13px;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;color:#555;transition:all .15s;margin-bottom:-2px}
.tab.on{color:#0d47a1;border-bottom-color:#0d47a1;font-weight:600}
.tab:hover{color:#0d47a1}
/* ── content ── */
#content{padding:20px;max-width:1400px;margin:0 auto}
/* ── KPI cards ── */
.kpi-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.kpi{background:#fff;border-radius:10px;padding:16px 20px;flex:1;min-width:200px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-top:4px solid #0d47a1}
.kpi .lbl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi .val{font-size:26px;font-weight:700;color:#0d47a1}
.kpi .sub{font-size:12px;color:#666;margin-top:4px}
.pos{color:#2e7d32!important}.neg{color:#c62828!important}
/* ── chart ── */
.chart-box{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:20px}
.chart-box h3{font-size:14px;font-weight:600;margin-bottom:12px;color:#333}
#chartWrap{width:100%;overflow:hidden}
/* ── table ── */
.tbl-box{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tbl-box h3{font-size:14px;font-weight:600;margin-bottom:12px;color:#333}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#e8edf5;padding:8px 10px;text-align:right;font-weight:600;color:#333;white-space:nowrap;position:sticky;top:0}
th:first-child{text-align:left}
td{padding:6px 10px;text-align:right;border-bottom:1px solid #f0f0f0;white-space:nowrap}
td:first-child{text-align:left;font-weight:500;color:#222;max-width:280px;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:#f5f8ff}
tr.total-row td{background:#e8edf5;font-weight:700;border-top:2px solid #ccc}
.pct-pos{color:#2e7d32}.pct-neg{color:#c62828}.pct-neu{color:#888}
.share{color:#555}
</style>

const ROWS = RAW.rows;
const LC_SYM = RAW.lc_sym;

// ── state ─────────────────────────────────────────────────────────────────
const S = {
  months: [1,2,3,4,5,6],
  c2:'', ch:'', br:'', fp:'', cat:'', sku:'',
  measure:'usd',
  tab:'ov'
};

// ── helpers ───────────────────────────────────────────────────────────────
const MONTHS_EN = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function filterReal(year){
  return ROWS.filter(r=>
    r.t==='R' && r.y===year && S.months.includes(r.m) &&
    (!S.c2  || r.c2===S.c2)  &&
    (!S.ch  || r.ch===S.ch)  &&
    (!S.br  || r.br===S.br)  &&
    (!S.fp  || r.fp===S.fp)  &&
    (!S.cat || r.cat===S.cat)&&
    (!S.sku || r.sku===S.sku)
  );
}

function filterBP(year){
  return ROWS.filter(r=>
    r.t==='B' && r.y===year && S.months.includes(r.m) &&
    (!S.c2  || r.c2===S.c2)  &&
    (!S.ch  || r.ch===S.ch)  &&
    (!S.br  || r.br===S.br)  &&
    (!S.fp  || r.fp===S.fp)  &&
    (!S.cat || r.cat===S.cat)&&
    (!S.sku || r.sku===S.sku)
  );
}

function sumM(rows){
  return rows.reduce((a,r)=>a+r[S.measure],0);
}

function groupBy(rows,field){
  const m={};
  for(const r of rows){
    const k=r[field]||'(blank)';
    m[k]=(m[k]||0)+r[S.measure];
  }
  return m;
}

const fmtN=(v,dec=0)=>{
  if(v===null||v===undefined||isNaN(v))return'–';
  const abs=Math.abs(v);
  if(abs>=1e9) return (v/1e9).toFixed(1)+'B';
  if(abs>=1e6) return (v/1e6).toFixed(1)+'M';
  if(abs>=1e3) return (v/1e3).toFixed(1)+'K';
  return v.toFixed(dec);
};

const fmtFull=(v)=>{
  if(v===null||v===undefined||isNaN(v))return'–';
  return v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
};

const fmtPct=(v)=>{
  if(v===null||v===undefined||isNaN(v))return'–';
  const cls=v>0?'pct-pos':v<0?'pct-neg':'pct-neu';
  const sign=v>0?'+':'';
  return `<span class="${cls}">${sign}${(v*100).toFixed(1)}%</span>`;
};

const pct=(a,b)=>b?((a/b)-1):a?Infinity:0;

const fmtShare=(v)=>`<span class="share">${(v*100).toFixed(1)}%</span>`;

// ── populate dropdowns ────────────────────────────────────────────────────
function populateSelects(){
  const uniq=(field)=>{
    const s=new Set(ROWS.filter(r=>r.t==='R').map(r=>r[field]).filter(Boolean));
    return [...s].sort();
  };
  [['fC2','c2'],['fCh','ch'],['fBr','br'],['fFp','fp'],['fCat','cat'],['fSku','sku']].forEach(([id,field])=>{
    const el=document.getElementById(id);
    const opts=el.innerHTML;
    uniq(field).forEach(v=>{
      const o=document.createElement('option');
      o.value=v; o.textContent=v;
      el.appendChild(o);
    });
  });
}

// ── inline SVG line chart (no external library needed) ───────────────────
function drawLineChart(containerId, datasets){
  const el=document.getElementById(containerId);
  if(!el)return;
  const W=700,H=220,PT=15,PR=20,PB=28,PL=62,LH=28;
  const iW=W-PL-PR, iH=H-PT-PB;
  const labels=['Jan','Feb','Mar','Apr','May','Jun'];
  const vals=datasets.flatMap(d=>d.data).filter(v=>isFinite(v)&&v>0);
  if(!vals.length){el.innerHTML='<p style="color:#aaa;text-align:center;padding:50px 0">No data for selected filters</p>';return;}
  const maxV=Math.max(...vals)*1.12||1;
  const xs=i=>PL+i*iW/5;
  const ys=v=>PT+iH-Math.max(0,Math.min(1,v/maxV))*iH;
  let svg=`<svg viewBox="0 0 ${W} ${H+LH}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">`;
  // grid lines + y labels
  [0,.25,.5,.75,1].forEach(p=>{
    const v=maxV*p, y=ys(v);
    svg+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="${p===0?'#ccc':'#efefef'}" stroke-width="1"/>
          <text x="${(PL-4).toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#aaa">${fmtN(v,0)}</text>`;
  });
  svg+=`<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${(PT+iH).toFixed(1)}" stroke="#d0d0d0" stroke-width="1"/>`;
  // x labels
  labels.forEach((l,i)=>{svg+=`<text x="${xs(i).toFixed(1)}" y="${(PT+iH+14).toFixed(1)}" text-anchor="middle" font-size="10" fill="#999">${l}</text>`;});
  // lines + dots
  datasets.forEach(ds=>{
    const pts=ds.data.map((v,i)=>`${xs(i).toFixed(1)},${ys(v||0).toFixed(1)}`).join(' ');
    const da=ds.dash?`stroke-dasharray="${ds.dash}"`:'';
    svg+=`<polyline points="${pts}" fill="none" stroke="${ds.color}" stroke-width="${ds.w||2}" ${da} stroke-linejoin="round" stroke-linecap="round"/>`;
    ds.data.forEach((v,i)=>{svg+=`<circle cx="${xs(i).toFixed(1)}" cy="${ys(v||0).toFixed(1)}" r="${ds.w>2?4:3}" fill="${ds.color}" stroke="white" stroke-width="1.5"/>`;});
  });
  // legend
  let lx=PL;
  datasets.forEach(ds=>{
    const da=ds.dash?`stroke-dasharray="${ds.dash}"`:'';
    svg+=`<line x1="${lx}" y1="${H+14}" x2="${lx+18}" y2="${H+14}" stroke="${ds.color}" stroke-width="2.5" ${da}/>
          <circle cx="${lx+9}" cy="${H+14}" r="2.5" fill="${ds.color}"/>
          <text x="${lx+22}" y="${H+18}" font-size="10" fill="#666">${ds.label}</text>`;
    lx+=ds.label.length*6.8+30;
  });
  svg+='</svg>';
  el.innerHTML=svg;
}

function renderOverview(){

  const b26=filterBP(2026);

  const vsPrev=pct(t26,t25), vsBP=pct(t26,bp26);
  const mLabel=S.measure==='usd'?'USD':S.measure==='lc'?LC_SYM:'Units';

  const kpiHtml=`
  <div class="kpi-row">
    <div class="kpi">
      <div class="lbl">H1 2026 Sales (${mLabel})</div>
      <div class="val">${fmtN(t26,S.measure==='qty'?0:1)}</div>
      <div class="sub">${fmtFull(t26)}</div>
    </div>
    <div class="kpi" style="border-top-color:#1565c0">
      <div class="lbl">vs H1 2025</div>
      <div class="val ${vsPrev>0?'pos':vsPrev<0?'neg':''}">${isFinite(vsPrev)?((vsPrev>0?'+':'')+(vsPrev*100).toFixed(1)+'%'):'N/A'}</div>
      <div class="sub">2025: ${fmtN(t25,1)} | 2026: ${fmtN(t26,1)}</div>
    </div>
    <div class="kpi" style="border-top-color:#1976d2">
      <div class="lbl">vs BP 2026</div>
      <div class="val ${vsBP>0?'pos':vsBP<0?'neg':''}">${bp26?((vsBP>0?'+':'')+(vsBP*100).toFixed(1)+'%'):'No BP'}</div>
      <div class="sub">BP: ${fmtN(bp26,1)} | Real: ${fmtN(t26,1)}</div>
    </div>
    <div class="kpi" style="border-top-color:#42a5f5">
      <div class="lbl">vs H1 2024</div>
      <div class="val ${pct(t26,t24)>0?'pos':pct(t26,t24)<0?'neg':''}">${t24?((pct(t26,t24)>0?'+':'')+(pct(t26,t24)*100).toFixed(1)+'%'):'N/A'}</div>
      <div class="sub">2024: ${fmtN(t24,1)}</div>
    </div>
  </div>`;

  function monthlyByYear(year,typ){
    return [1,2,3,4,5,6].map(m=>
      ROWS.filter(r=>r.y===year&&r.m===m&&r.t===typ&&
        (!S.c2||r.c2===S.c2)&&(!S.ch||r.ch===S.ch)&&
        (!S.br||r.br===S.br)&&(!S.fp||r.fp===S.fp)&&
        (!S.cat||r.cat===S.cat)&&(!S.sku||r.sku===S.sku)
      ).reduce((a,r)=>a+r[S.measure],0)
    );
  }
  const d24=monthlyByYear(2024,'R');
  const d25=monthlyByYear(2025,'R');
  const d26=monthlyByYear(2026,'R');
  const dbp=monthlyByYear(2026,'B');

  document.getElementById('content').innerHTML=kpiHtml+`
  <div class="chart-box">
    <h3>Monthly Trend (H1) – ${mLabel}</h3>
    <div id="chartWrap"></div>
  </div>`;

  drawLineChart('chartWrap',[
    {label:'2024',data:d24,color:'#90a4ae',w:1.5},
    {label:'2025',data:d25,color:'#42a5f5',w:2},
    {label:'2026',data:d26,color:'#0d47a1',w:3},
    {label:'BP 2026',data:dbp,color:'#e53935',w:2,dash:'5,3'},
  ]);
}

// ── render table tab ──────────────────────────────────────────────────────
function renderTable(tabId){
  const CFG={
    c2 :{field:'c2', label:'Customer General', hasBP:false, topN:20},
    cbp:{field:'cbp',label:'Customer w/ BP',  hasBP:true,  topN:0},
    ch :{field:'ch', label:'Channel',        hasBP:true,  topN:0},
    br :{field:'br', label:'Brand',          hasBP:true,  topN:0},
    fp :{field:'fp', label:'Family BP',      hasBP:true,  topN:0},
    cat:{field:'cat',label:'Category',       hasBP:false, topN:0},
    sku:{field:'sku',label:'SKU',            hasBP:false, topN:0},
  };
  const cfg=CFG[tabId];
  const field=cfg.field;
  const hasBP=cfg.hasBP;
  const topN=cfg.topN;
  const mLabel=S.measure==='usd'?'USD':S.measure==='lc'?LC_SYM:'Units';

  const r24=groupBy(filterReal(2024),field);
  const r25=groupBy(filterReal(2025),field);
  const r26=groupBy(filterReal(2026),field);
  const bp=hasBP?groupBy(filterBP(2026),field):{};

  // Build key set
  let keys=new Set([...Object.keys(r26),...Object.keys(r25),...Object.keys(r24)]);
  if(hasBP) Object.keys(bp).forEach(k=>keys.add(k));
  keys=Array.from(keys);

  // Build rows
  let rows=keys.map(k=>{
    const v24=r24[k]||0, v25=r25[k]||0, v26=r26[k]||0, vbp=hasBP?(bp[k]||0):0;
    return {k,v24,v25,v26,vbp};
  });

  // Sort by 2026 desc
  rows.sort((a,b)=>b.v26-a.v26);
  // Remove all-zero rows
  rows=rows.filter(r=>r.v24||r.v25||r.v26||r.vbp);

  // Total
  const tot24=rows.reduce((a,r)=>a+r.v24,0);
  const tot25=rows.reduce((a,r)=>a+r.v25,0);
  const tot26=rows.reduce((a,r)=>a+r.v26,0);
  const totbp=hasBP?rows.reduce((a,r)=>a+r.vbp,0):0;

  // Apply topN after sort
  const all=rows;
  if(topN>0) rows=rows.slice(0,topN);

  // Header
  let hdr=`<tr>
    <th>${cfg.label}</th>
    <th>2024</th><th>2025</th><th>%&nbsp;YoY</th>
    <th>2026</th><th>%&nbsp;YoY</th>`;
  if(hasBP) hdr+=`<th>BP&nbsp;2026</th><th>%&nbsp;vs&nbsp;BP</th>`;
  hdr+=`<th>Share&nbsp;'25</th><th>Share&nbsp;'26</th></tr>`;

  // Rows
  const rowHtml=rows.map(r=>{
    const yoy=fmtPct(pct(r.v26,r.v25));
    const yoy24=fmtPct(pct(r.v25,r.v24));
    const vsBP=hasBP?fmtPct(pct(r.v26,r.vbp)):'';
    const sh25=tot25?fmtShare(r.v25/tot25):'–';
    const sh26=tot26?fmtShare(r.v26/tot26):'–';
    let row=`<tr>
      <td>${r.k}</td>
      <td>${fmtN(r.v24,0)}</td>
      <td>${fmtN(r.v25,0)}</td>
      <td>${yoy24}</td>
      <td><strong>${fmtN(r.v26,0)}</strong></td>
      <td>${yoy}</td>`;
    if(hasBP) row+=`<td>${fmtN(r.vbp,0)}</td><td>${vsBP}</td>`;
    row+=`<td>${sh25}</td><td>${sh26}</td></tr>`;
    return row;
  }).join('');

  // Total row
  let totRow=`<tr class="total-row">
    <td>TOTAL${topN>0?' (Top '+topN+')':''}</td>
    <td>${fmtN(tot24,0)}</td>
    <td>${fmtN(tot25,0)}</td>
    <td>${fmtPct(pct(tot25,tot24))}</td>
    <td>${fmtN(tot26,0)}</td>
    <td>${fmtPct(pct(tot26,tot25))}</td>`;
  if(hasBP) totRow+=`<td>${fmtN(totbp,0)}</td><td>${fmtPct(pct(tot26,totbp))}</td>`;
  totRow+=`<td>100%</td><td>100%</td></tr>`;

  const note=topN>0&&all.length>topN?`<p style="font-size:11px;color:#888;margin-top:8px">Showing Top ${topN} of ${all.length} entries by 2026 value</p>`:'';

  document.getElementById('content').innerHTML=`
  <div class="tbl-box">
    <h3>${cfg.label} – ${mLabel}${topN>0?' (Top '+topN+')':''}</h3>
    <div class="tbl-wrap">
      <table>
        <thead>${hdr}</thead>
        <tbody>${rowHtml}</tbody>
        <tfoot>${totRow}</tfoot>
      </table>
    </div>
    ${note}
  </div>`;
}

// ── main render ───────────────────────────────────────────────────────────
function render(){
  if(S.tab==='ov') renderOverview();
  else renderTable(S.tab);
}

// ── event wiring ──────────────────────────────────────────────────────────
document.querySelectorAll('.mpill').forEach(el=>{
  el.addEventListener('click',()=>{
    el.classList.toggle('on');
    const m=+el.dataset.m;
    if(el.classList.contains('on'))S.months.push(m);
    else S.months=S.months.filter(x=>x!==m);
    if(!S.months.length){el.classList.add('on');S.months=[m];}  // at least one
    render();
  });
});

document.querySelectorAll('.mtog button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.mtog button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    S.measure=b.dataset.ms;
    render();
  });
});

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    S.tab=t.dataset.tab;
    render();
  });
});

[['fC2','c2'],['fCh','ch'],['fBr','br'],['fFp','fp'],['fCat','cat'],['fSku','sku']].forEach(([id,field])=>{
  document.getElementById(id).addEventListener('change',function(){
    S[field]=this.value;
    render();
  });
});

// ── init ──────────────────────────────────────────────────────────────────
document.getElementById('lastupd').textContent='Updated: '+new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
populateSelects();
render();
</script>
