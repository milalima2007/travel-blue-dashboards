*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;font-size:13px}
/* ── header ── */
#hdr{background:#0d47a1;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#hdr h1{font-size:18px;font-weight:600;flex:1}
/* ── filter bar ── */
#fbar{background:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #ddd;position:sticky;top:48px;z-index:99;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.mpill{padding:4px 10px;border-radius:12px;border:1px solid #90caf9;background:#e3f2fd;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.mpill.on{background:#0d47a1;color:#fff;border-color:#0d47a1}
.fsel{padding:4px 8px;border:1px solid #ccc;border-radius:6px;font-size:12px;background:#fafafa;cursor:pointer;min-width:110px}
.fsep{width:1px;height:22px;background:#ddd;margin:0 4px}
.mtog{display:flex;gap:0;border:1px solid #90caf9;border-radius:8px;overflow:hidden}
.mtog button{padding:4px 10px;border:none;background:#e3f2fd;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.mtog button.on{background:#0d47a1;color:#fff}
/* ── tabs ── */
#tabs{background:#fff;border-bottom:2px solid #e0e0e0;display:flex;overflow-x:auto;padding:0 20px}
.tab{padding:10px 16px;cursor:pointer;font-size:13px;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;color:#555;transition:all .15s;margin-bottom:-2px}
.tab.on{color:#0d47a1;border-bottom-color:#0d47a1;font-weight:600}
.tab:hover{color:#0d47a1}
/* ── content ── */
#content{padding:20px;max-width:1400px;margin:0 auto}
/* ── KPI cards ── */
.kpi-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.kpi{background:#fff;border-radius:10px;padding:16px 20px;flex:1;min-width:200px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-top:4px solid #0d47a1}
.kpi .lbl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi .val{font-size:26px;font-weight:700;color:#0d47a1}
.kpi .sub{font-size:12px;color:#666;margin-top:4px}
.pos{color:#2e7d32!important}.neg{color:#c62828!important}
/* ── chart ── */
.chart-box{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:20px}
.chart-box h3{font-size:14px;font-weight:600;margin-bottom:12px;color:#333}
#chartWrap{width:100%;overflow:hidden}
/* ── table ── */
.tbl-box{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tbl-box h3{font-size:14px;font-weight:600;margin-bottom:12px;color:#333}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#e8edf5;padding:8px 10px;text-align:right;font-weight:600;color:#333;white-space:nowrap;position:sticky;top:0}
th:first-child{text-align:left}
td{padding:6px 10px;text-align:right;border-bottom:1px solid #f0f0f0;white-space:nowrap}
td:first-child{text-align:left;font-weight:500;color:#222;max-width:280px;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:#f5f8ff}
tr.total-row td{background:#e8edf5;font-weight:700;border-top:2px solid #ccc}
.pct-pos{color:#2e7d32}.pct-neg{color:#c62828}.pct-neu{color:#888}
.share{color:#555}

.bp-table-wrap { overflow-x: auto; }
.bp-table { border-collapse: collapse; width: 100%; font-size: 13px; }
.bp-table th, .bp-table td { border: 1px solid #dde; padding: 5px 10px; text-align: right; white-space: nowrap; }
.bp-table th { background: #e8eaf6; font-weight: 600; text-align: center; }
.bp-table td:first-child { text-align: left; font-weight: 500; }
.bp-table tr:nth-child(even) { background: #f5f5fb; }
.bp-table tr:hover { background: #e8eaf6; }

  return v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
};

const fmtPct=(v)=>{
  if(v===null||v===undefined||!isFinite(v))return'–';
  const cls=v>0?'pct-pos':v<0?'pct-neg':'pct-neu';
  const sign=v>0?'+':'';
  return `<span class="${cls}">${sign}${(v*100).toFixed(1)}%</span>`;
};

const pct=(a,b)=>b?((a/b)-1):a?Infinity:0;

const fmtShare=(v)=>`<span class="share">${(v*100).toFixed(1)}%</span>`;

// ── populate dropdowns ────────────────────────────────────────────────────
function populateSelects(){
  const uniq=(field)=>{
    const s=new Set(ROWS.filter(r=>r.t==='R').map(r=>r[field]).filter(Boolean));
    return [...s].sort();
  };
  [['fC2','c2'],['fCh','ch'],['fBr','br'],['fFp','fp'],['fCat','cat'],['fSku','sku']].forEach(([id,field])=>{

      o.value=v; o.textContent=v;

}

// ── inline SVG line chart (no external library needed) ───────────────────
function drawLineChart(containerId, datasets){
  const el=document.getElementById(containerId);
  if(!el)return;
  const W=700,H=220,PT=15,PR=20,PB=28,PL=62,LH=28;
  const iW=W-PL-PR, iH=H-PT-PB;
  const labels=S.months.map(m=>MONTHS_EN[m]);
  const vals=datasets.flatMap(d=>d.data).filter(v=>isFinite(v)&&v>0);
  if(!vals.length){el.innerHTML='<p style="color:#aaa;text-align:center;padding:50px 0">No data for selected filters</p>';return;}
  const maxV=Math.max(...vals)*1.12||1;
  const xs=i=>PL+i*iW/Math.max(1,labels.length-1);
  const ys=v=>PT+iH-Math.max(0,Math.min(1,v/maxV))*iH;
  let svg=`<svg viewBox="0 0 ${W} ${H+LH}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">`;
  // grid lines + y labels
  [0,.25,.5,.75,1].forEach(p=>{
    const v=maxV*p, y=ys(v);
    svg+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="${p===0?'#ccc':'#efefef'}" stroke-width="1"/>
          <text x="${(PL-4).toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#aaa">${fmtN(v,0)}</text>`;
  });
  svg+=`<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${(PT+iH).toFixed(1)}" stroke="#d0d0d0" stroke-width="1"/>`;
  // x labels
  labels.forEach((l,i)=>{svg+=`<text x="${xs(i).toFixed(1)}" y="${(PT+iH+14).toFixed(1)}" text-anchor="middle" font-size="10" fill="#999">${l}</text>`;});
  // lines + dots
  datasets.forEach(ds=>{
    const pts=ds.data.map((v,i)=>`${xs(i).toFixed(1)},${ys(v||0).toFixed(1)}`).join(' ');
    const da=ds.dash?`stroke-dasharray="${ds.dash}"`:'';
    svg+=`<polyline points="${pts}" fill="none" stroke="${ds.color}" stroke-width="${ds.w||2}" ${da} stroke-linejoin="round" stroke-linecap="round"/>`;
    ds.data.forEach((v,i)=>{svg+=`<circle cx="${xs(i).toFixed(1)}" cy="${ys(v||0).toFixed(1)}" r="${ds.w>2?4:3}" fill="${ds.color}" stroke="white" stroke-width="1.5"/>`;});
  });
  // legend
  let lx=PL;
  datasets.forEach(ds=>{
    const da=ds.dash?`stroke-dasharray="${ds.dash}"`:'';
    svg+=`<line x1="${lx}" y1="${H+14}" x2="${lx+18}" y2="${H+14}" stroke="${ds.color}" stroke-width="2.5" ${da}/>
          <circle cx="${lx+9}" cy="${H+14}" r="2.5" fill="${ds.color}"/>
          <text x="${lx+22}" y="${H+18}" font-size="10" fill="#666">${ds.label}</text>`;
    lx+=ds.label.length*6.8+30;
  });
  svg+='</svg>';
  el.innerHTML=svg;
}

function mkBPTable(field, label) {
  const mLabel = S.measure==='usd'?'USD':S.measure==='lc'?LC_SYM:'Units';
  const r25 = groupBy(filterReal(2025), field);
  const r26 = groupBy(filterReal(2026), field);
  const bp  = groupBy(filterBP(2026),  field);
  const keys = [...new Set([...Object.keys(r26), ...Object.keys(bp)])]
    .sort((a,b)=>(r26[b]||0)-(r26[a]||0));
  const tot26 = Object.values(r26).reduce((a,b)=>a+b,0);
  const fmt = v => v ? (S.measure==='qty' ? Math.round(v).toLocaleString()
                                           : fmtN(v,1)) : '—';
  const pp  = (a,b) => {
    if(!b) return '—';
    const v=(a-b)/Math.abs(b)*100;
    return `<span style="color:${a>=b?'#1b5e20':'#b71c1c'}">${v>0?'+':''}${v.toFixed(1)}%</span>`;
  };
  let rows = keys.map(k=>{
    const v25=r25[k]||0, v26=r26[k]||0, vbp=bp[k]||0;
    const sh = tot26 ? (v26/tot26*100).toFixed(1)+'%' : '—';
    return `<tr><td>${k}</td><td>${fmt(v25)}</td><td>${fmt(v26)}</td>`+
           `<td>${pp(v26,v25)}</td><td>${fmt(vbp)}</td>`+
           `<td>${pp(v26,vbp)}</td><td>${sh}</td></tr>`;
  }).join('');
  return `<div class="bp-table-wrap" style="margin-top:24px">`+
         `<h3 style="margin-bottom:8px">${label} – ${mLabel}</h3>`+
         `<table class="bp-table"><thead><tr><th>${label}</th>`+
         `<th>Real 2025</th><th>Real 2026</th><th>%YoY</th>`+
         `<th>BP 2026</th><th>%vsBP</th><th>Share'26</th></tr></thead>`+
         `<tbody>${rows}</tbody></table></div>`;
}

function renderOverview(){
  const r24=filterReal(2024), r25=filterReal(2025), r26=filterReal(2026);
  const b26=filterBP(2026);
  const t24=sumM(r24), t25=sumM(r25), t26=sumM(r26), bp26=sumM(b26);
  const vsPrev=pct(t26,t25), vsBP=pct(t26,bp26);
  const mLabel=S.measure==='usd'?'USD':S.measure==='lc'?LC_SYM:'Units';

  const kpiHtml=`
  <div class="kpi-row">
    <div class="kpi">
      <div class="lbl">2026 Sales (${mLabel})</div>
      <div class="val">${fmtN(t26,S.measure==='qty'?0:1)}</div>
    </div>
    <div class="kpi" style="border-top-color:#1565c0">
      <div class="lbl">vs 2025</div>
      <div class="val ${vsPrev>0?'pos':vsPrev<0?'neg':''}">${isFinite(vsPrev)?((vsPrev>0?'+':'')+(vsPrev*100).toFixed(1)+'%'):'N/A'}</div>
      <div class="sub">2025: ${fmtN(t25,1)} | 2026: ${fmtN(t26,1)}</div>
    </div>
    <div class="kpi" style="border-top-color:#1976d2">
      <div class="lbl">vs BP 2026</div>

      <div class="sub">BP: ${fmtN(bp26,1)} | Real: ${fmtN(t26,1)}</div>

      <div class="lbl">vs 2024</div>
      <div class="val ${pct(t26,t24)>0?'pos':pct(t26,t24)<0?'neg':''}">${t24?((pct(t26,t24)>0?'+':'')+(pct(t26,t24)*100).toFixed(1)+'%'):'N/A'}</div>
      <div class="sub">2024: ${fmtN(t24,1)}</div>

        (!S.c2||r.c2===S.c2)&&(!S.ch||r.ch===S.ch)&&
        (!S.br||r.br===S.br)&&(!S.fp||r.fp===S.fp)&&
        (!S.cat||r.cat===S.cat)&&(!S.sku||r.sku===S.sku)
      ).reduce((a,r)=>a+r[S.measure],0)
    );
  }
  const d24=monthlyByYear(2024,'R');
  const d25=monthlyByYear(2025,'R');
  const d26=monthlyByYear(2026,'R');
  const dbp=monthlyByYear(2026,'B');

  <div id="bp-tables"></div>`;

    {label:'2024',data:d24,color:'#90a4ae',w:1.5},
    {label:'2025',data:d25,color:'#42a5f5',w:2},
    {label:'2026',data:d26,color:'#0d47a1',w:3},
    {label:'BP 2026',data:dbp,color:'#e53935',w:2,dash:'5,3'},
  ]);

}

// ── render table tab ──────────────────────────────────────────────────────
function renderTable(tabId){
  const CFG={
    c2 :{field:'c2', label:'Customer General', hasBP:false, topN:20},
    cbp:{field:'cbp',label:'Customer w/ BP',  hasBP:true,  topN:0},
    ch :{field:'ch', label:'Channel',        hasBP:true,  topN:0},
    br :{field:'br', label:'Brand',          hasBP:true,  topN:0},
    fp :{field:'fp', label:'Family BP',      hasBP:true,  topN:0},
    cat:{field:'cat',label:'Category',       hasBP:false, topN:0},
    sku:{field:'sku',label:'SKU',            hasBP:false, topN:0},
  };
  const cfg=CFG[tabId];
  const field=cfg.field;
  const hasBP=cfg.hasBP;
  const topN=cfg.topN;
  const mLabel=S.measure==='usd'?'USD':S.measure==='lc'?LC_SYM:'Units';

  const r24=groupBy(filterReal(2024),field);
  const r25=groupBy(filterReal(2025),field);
  const r26=groupBy(filterReal(2026),field);
  const bp=hasBP?groupBy(filterBP(2026),field):{};

  // Build key set
  let keys=new Set([...Object.keys(r26),...Object.keys(r25),...Object.keys(r24)]);
  if(hasBP) Object.keys(bp).forEach(k=>keys.add(k));
  keys=Array.from(keys);

  // Build rows
  let rows=keys.map(k=>{
    const v24=r24[k]||0, v25=r25[k]||0, v26=r26[k]||0, vbp=hasBP?(bp[k]||0):0;
    return {k,v24,v25,v26,vbp};
  });

  // Sort by 2026 desc
  rows.sort((a,b)=>b.v26-a.v26);
  // Remove all-zero rows
  rows=rows.filter(r=>r.v24||r.v25||r.v26||r.vbp);

  // Total
  const tot24=rows.reduce((a,r)=>a+r.v24,0);
  const tot25=rows.reduce((a,r)=>a+r.v25,0);
  const tot26=rows.reduce((a,r)=>a+r.v26,0);
  const totbp=hasBP?rows.reduce((a,r)=>a+r.vbp,0):0;

  // Apply topN after sort
  const all=rows;
  if(topN>0) rows=rows.slice(0,topN);

  // Header
  let hdr=`<tr>
    <th>${cfg.label}</th>
    <th>2024</th><th>2025</th><th>%&nbsp;YoY</th>
    <th>2026</th><th>%&nbsp;YoY</th>`;
  if(hasBP) hdr+=`<th>BP&nbsp;2026</th><th>%&nbsp;vs&nbsp;BP</th>`;
  hdr+=`<th>Share&nbsp;'25</th><th>Share&nbsp;'26</th></tr>`;

  // Rows
  const rowHtml=rows.map(r=>{
    const yoy=fmtPct(pct(r.v26,r.v25));
    const yoy24=fmtPct(pct(r.v25,r.v24));
    const vsBP=hasBP?fmtPct(pct(r.v26,r.vbp)):'';
    const sh25=tot25?fmtShare(r.v25/tot25):'–';
    const sh26=tot26?fmtShare(r.v26/tot26):'–';
    let row=`<tr>
      <td>${r.k}</td>
      <td>${fmtN(r.v24,0)}</td>
      <td>${fmtN(r.v25,0)}</td>
      <td>${yoy24}</td>
      <td><strong>${fmtN(r.v26,0)}</strong></td>
      <td>${yoy}</td>`;
    if(hasBP) row+=`<td>${fmtN(r.vbp,0)}</td><td>${vsBP}</td>`;
    row+=`<td>${sh25}</td><td>${sh26}</td></tr>`;
    return row;
  }).join('');

  // Total row
  let totRow=`<tr class="total-row">
    <td>TOTAL${topN>0?' (Top '+topN+')':''}</td>
    <td>${fmtN(tot24,0)}</td>
    <td>${fmtN(tot25,0)}</td>
    <td>${fmtPct(pct(tot25,tot24))}</td>
    <td>${fmtN(tot26,0)}</td>
    <td>${fmtPct(pct(tot26,tot25))}</td>`;
  if(hasBP) totRow+=`<td>${fmtN(totbp,0)}</td><td>${fmtPct(pct(tot26,totbp))}</td>`;
  totRow+=`<td>100%</td><td>100%</td></tr>`;

  const note=topN>0&&all.length>topN?`<p style="font-size:11px;color:#888;margin-top:8px">Showing Top ${topN} of ${all.length} entries by 2026 value</p>`:'';

  document.getElementById('content').innerHTML=`
  <div class="tbl-box">
    <h3>${cfg.label} – ${mLabel}${topN>0?' (Top '+topN+')':''}</h3>
    <div class="tbl-wrap">
      <table>
        <thead>${hdr}</thead>
        <tbody>${rowHtml}</tbody>
        <tfoot>${totRow}</tfoot>
      </table>
    </div>
    ${note}
  </div>`;
}

function bp27N(v){if(v===null||v===undefined||isNaN(v))return '–';return Math.round(v).toLocaleString('en-US');}
function bp27Per(){const m=S.months;const c=m.every((v,i)=>!i||v===m[i-1]+1);return c?(m.length===1?MONTHS_EN[m[0]]:MONTHS_EN[m[0]]+'–'+MONTHS_EN[m[m.length-1]]):m.map(x=>MONTHS_EN[x]).join('+');}
const BP27R = BP27.rows.map(a=>({t:a[0],m:a[1],cu:BP27.dict.cu[a[2]],ch:BP27.dict.ch[a[3]],br:BP27.dict.br[a[4]],fa:BP27.dict.fa[a[5]],usd:a[6],lc:a[7],qty:a[8]}));
function bp27Ok(r){return (!S.ch || r.ch===S.ch) && (!S.br || r.br===S.br);}
function bp27Rows(t, allMonths){return BP27R.filter(r=>r.t===t && (allMonths || S.months.includes(r.m)) && bp27Ok(r));}
function bp27Sum(rows){return rows.reduce((s,r)=>s+r[S.measure],0);}
function bp27Grp(rows, f){const o={};rows.forEach(r=>{o[r[f]]=(o[r[f]]||0)+r[S.measure];});return o;}
function bp27Unit(){return S.measure==='usd'?'USD':S.measure==='lc'?LC_SYM:'Units';}
function bp27Pct(b,a){   // base 2026 zero ou negativa: sem %
  if(!(a>0))return '<span class="bp27-na">–</span>';
  const v=b/a-1;return `<span class="bp27-pill ${v>=0?'bp27-up':'bp27-dn'}">${v>0?'+':''}${(v*100).toFixed(1)}%</span>`;
}
function bp27Table(f, label){
  const a=bp27Grp(bp27Rows(0,false),f), b=bp27Grp(bp27Rows(1,false),f), y=bp27Grp(bp27Rows(1,true),f);
  const keys=[...new Set([...Object.keys(a),...Object.keys(b),...Object.keys(y)])].filter(k=>a[k]||b[k]||y[k])
    .sort((p,q)=>(y[q]||0)-(y[p]||0));
  const ta=keys.reduce((s,k)=>s+(a[k]||0),0), tb=keys.reduce((s,k)=>s+(b[k]||0),0), ty=keys.reduce((s,k)=>s+(y[k]||0),0);
  const pl=bp27Per(), mx=Math.max(1,...keys.map(k=>Math.abs(y[k]||0)));
  const tr=keys.map(k=>{const sh=ty?(y[k]||0)/ty:0;
    return `<tr><td title="${k}">${k}</td><td>${bp27N(a[k]||0)}</td><td class="bpc">${bp27N(b[k]||0)}</td><td>${bp27Pct(b[k]||0,a[k]||0)}</td>`+
    `<td class="bpc">${bp27N(y[k]||0)}</td><td><div class="bp27-share"><i style="width:${Math.max(2,Math.abs(y[k]||0)/mx*40).toFixed(0)}px"></i>${(sh*100).toFixed(1)}%</div></td></tr>`;}).join('');
  return `<div class="bp27-box"><h3>${label} <span class="u">${bp27Unit()}</span></h3><div class="tbl-wrap"><table class="bp27t">`+
    `<thead><tr><th>${label}</th><th>Real 2026<br>${pl}</th><th class="bpc">BP 2027<br>${pl}</th><th>BP 2027<br>vs 2026</th><th class="bpc">BP 2027<br>Full year</th><th>Share<br>BP 2027</th></tr></thead>`+
    `<tbody>${tr}</tbody><tfoot><tr><td>TOTAL</td><td>${bp27N(ta)}</td><td class="bpc">${bp27N(tb)}</td><td>${bp27Pct(tb,ta)}</td><td class="bpc">${bp27N(ty)}</td><td>100%</td></tr></tfoot></table></div></div>`;
}
function bp27Monthly(t){
  const v=Array(13).fill(0);BP27R.forEach(r=>{if(r.t===t&&bp27Ok(r))v[r.m]+=r[S.measure];});return v;
}
function bp27Chart(){
  const s25=bp27Monthly(2), s26=bp27Monthly(0), s27=bp27Monthly(1);
  const ser=[
    {lbl:'2025',c:'#90a4ae',w:2.2,dash:'6,4',d:s25.slice(1)},
    {lbl:'2026 (actual through '+MONTHS_EN[BP27.last]+')',c:'#1e88e5',w:3,d:s26.slice(1).map((x,i)=>i+1<=BP27.last?x:null)},
    {lbl:'BP 2027',c:'#e65100',w:3.6,d:s27.slice(1)}];
  const W=1100,H=330,L=70,R=20,T=24,B=36,iw=W-L-R,ih=H-T-B;
  const vals=ser.flatMap(s=>s.d).filter(v=>v!==null);
  const raw=Math.max(1,...vals)*1.05, mn0=Math.min(0,...vals);
  const p10=Math.pow(10,Math.floor(Math.log10((raw-mn0)/5))), step=[1,2,2.5,5,10].map(f=>f*p10).find(s=>(raw-mn0)/s<=5);
  const mn=Math.floor(mn0/step)*step, mx=Math.ceil(raw/step)*step, nt=Math.round((mx-mn)/step);
  const X=i=>L+i*iw/11, Y=v=>T+ih-(v-mn)/(mx-mn)*ih;
  let g='';
  for(let k=0;k<=nt;k++){const v=mn+step*k,y=Y(v);
    g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="${k?'#eceff1':'#b0bec5'}"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#78909c">${bp27N(v)}</text>`;}
  for(let i=0;i<12;i++){g+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="12" font-weight="600" fill="#546e7a">${MONTHS_EN[i+1]}</text>`;}
  if(BP27.last<12){const x=(X(BP27.last-1)+X(BP27.last))/2;g+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${T+ih}" stroke="#cfd8dc" stroke-dasharray="3,3"/>`;}
  ser.forEach(s=>{
    let p='',open=false;
    s.d.forEach((v,i)=>{if(v===null){open=false;return;}p+=(open?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)+' ';open=true;});
    g+=`<path d="${p}" fill="none" stroke="${s.c}" stroke-width="${s.w}" ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`;
    s.d.forEach((v,i)=>{if(v!==null)g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${s.w>3?4.5:3.5}" fill="#fff" stroke="${s.c}" stroke-width="2.2"><title>${s.lbl} · ${MONTHS_EN[i+1]}: ${bp27N(v)}</title></circle>`;});
  });
  const tot=a=>a.slice(1).reduce((x,y)=>x+y,0);
  const leg=ser.map((s,i)=>`<span><b style="background:${s.c}"></b>${s.lbl}: ${bp27N([tot(s25),s26.slice(1,BP27.last+1).reduce((x,y)=>x+y,0),tot(s27)][i])}</span>`).join('');
  return `<div class="bp27-box"><h3>Monthly trend – 2025 · 2026 · BP 2027 <span class="u">${bp27Unit()}</span></h3>`+
    `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:640px;display:block">${g}</svg></div><div class="bp27-legend">${leg}</div></div>`;
}
function renderBP27(){
  const a=bp27Sum(bp27Rows(0,false)), b=bp27Sum(bp27Rows(1,false)), y=bp27Sum(bp27Rows(1,true)), y25=bp27Sum(bp27Rows(2,true));
  const v=a>0?b/a-1:NaN, pl=bp27Per();
  const ign=[S.c2&&'Customer',S.fp&&'Family BP',S.cat&&'Category',S.sku&&'SKU'].filter(Boolean);

    `Includes the 4 customers billed by TB UK / TB Malta (UK SALES, manager Piotr). Customers without BP are grouped in OTHERS. Family = current product family.</p>`+

  const kpi=`<div class="bp27-kpis">

    <div class="bp27-kpi"><div class="lbl">BP 2027 · ${pl}</div><div class="val bp27-c27">${bp27N(b)}</div><div class="sub">same months as 2026 actuals</div></div>
    <div class="bp27-kpi" style="border-left-color:#1e88e5"><div class="lbl">Actual 2026 · ${pl}</div><div class="val bp27-c26">${bp27N(a)}</div><div class="sub">Poland + UK customers of Piotr</div></div>
    <div class="bp27-kpi" style="border-left-color:${v>=0?'#43a047':'#e53935'}"><div class="lbl">BP 2027 vs 2026 · ${pl}</div><div class="val" style="color:${v>=0?'#2e7d32':'#c62828'}">${isFinite(v)?((v>0?'+':'')+(v*100).toFixed(1)+'%'):'N/A'}</div><div class="sub">${isFinite(v)?((b-a>=0?'+':'')+bp27N(b-a)+' '+bp27Unit()):''}</div></div>

  const mr=[];let ta=0,tb=0;

    const r25=BP27R.filter(r=>r.t===2&&r.m===m&&bp27Ok(r)).reduce((s,r)=>s+r[S.measure],0);
    const rb=BP27R.filter(r=>r.t===1&&r.m===m&&bp27Ok(r)).reduce((s,r)=>s+r[S.measure],0);
    if(ra!==null){ta+=ra;} tb+=rb;
    mr.push(`<tr><td>${MONTHS_EN[m]}</td><td>${bp27N(r25)}</td><td>${ra===null?'<span class="bp27-na">–</span>':bp27N(ra)}</td><td class="bpc">${bp27N(rb)}</td><td>${ra===null?'<span class="bp27-na">–</span>':bp27Pct(rb,ra)}</td></tr>`);
  }
  const t25=bp27Sum(bp27Rows(2,true));
  const mt=`<div class="bp27-box"><h3>Month by month <span class="u">${bp27Unit()}</span></h3><div class="tbl-wrap"><table class="bp27t">`+
    `<thead><tr><th>Month</th><th>Actual 2025</th><th>Actual 2026</th><th class="bpc">BP 2027</th><th>BP 2027<br>vs 2026</th></tr></thead><tbody>${mr.join('')}</tbody>`+
    `<tfoot><tr><td>TOTAL</td><td>${bp27N(t25)}</td><td>${bp27N(ta)}</td><td class="bpc">${bp27N(tb)}</td><td><span class="bp27-na">–</span></td></tr></tfoot></table></div></div>`;
  document.getElementById('content').innerHTML=hero+kpi+bp27Chart()+
    bp27Table('cu','Customer')+`<div class="bp27-grid">${bp27Table('ch','Channel')}${bp27Table('br','Brand')}</div><div style="height:18px"></div>`+
    `<div class="bp27-grid">${bp27Table('fa','Family')}${mt}</div>`;
}

    el.classList.toggle('on');
    const m=+el.dataset.m;
    if(el.classList.contains('on')){S.months.push(m);S.months.sort((a,b)=>a-b);}
    else S.months=S.months.filter(x=>x!==m);
    S.months.sort((a,b)=>a-b);
    if(!S.months.length){el.classList.add('on');S.months=[m];}  // at least one
    render();
  });
});

document.querySelectorAll('.mtog button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.mtog button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    S.measure=b.dataset.ms;
    render();
  });
});

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    S.tab=t.dataset.tab;
    render();
  });
});

[['fC2','c2'],['fCh','ch'],['fBr','br'],['fFp','fp'],['fCat','cat'],['fSku','sku']].forEach(([id,field])=>{
  document.getElementById(id).addEventListener('change',function(){
    S[field]=this.value;
    render();
  });
});

document.getElementById('lastupd').textContent='Updated: '+new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
populateSelects();
render();
</script>
